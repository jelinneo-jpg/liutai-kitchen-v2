<!DOCTYPE html>

<meta charset="UTF-8">

  name="viewport"

<title>刘太厨房</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8f2;
  color: #3d2b24;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",

}

/* =====================================================
   🔒 网页密码锁
===================================================== */

.password-screen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #fff8f2;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.password-screen.hidden {
  display: none !important;
}

.password-card {
  width: 100%;
  max-width: 380px;
  background: white;
  border-radius: 24px;
  padding: 30px 24px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.password-lock {
  text-align: center;
  font-size: 52px;
  margin-bottom: 8px;
}

.password-card h1 {
  text-align: center;
  margin: 0;
  font-size: 28px;
  color: #3d2b24;
}

.password-card p {
  text-align: center;
  color: #987d70;
  margin: 10px 0 20px;
}

.password-card input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #ead8cc;
  border-radius: 14px;
  font-size: 18px;
  text-align: center;
  outline: none;
  margin: 0 0 12px;
  background: white;
}

.password-card input:focus {
  border-color: #e69765;
  box-shadow: 0 0 0 3px rgba(230,151,101,.12);
}

.password-card button {
  width: 100%;
  border: 0;
  background: #e69765;
  color: white;
  padding: 14px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
}

.password-error {
  text-align: center;
  color: #d65c4a;
  font-size: 14px;
  min-height: 20px;
  margin-top: 10px;
}

/* =====================================================
   HEADER
===================================================== */

header {
  background: #f4c4a4;
  text-align: center;
  padding: 28px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {

}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;

  background: white;

}

nav button {
  border: 0;
  border-radius: 20px;
  padding: 10px 15px;

  color: #8a573d;

nav button.active {

main {

}

.food-icon {

  text-align: center;
  margin-bottom: 5px;
}

.food-name {

}

.tag {

  width: fit-content;
  margin: 0 auto 15px;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 5px 10px;

  font-size: 13px;
}

.action-row {
  display: flex;
  gap: 8px;
}

button.action {

  border: 0;
  background: #e69765;
  color: white;

  font-size: 15px;
}

button.action.husband {

}

button.delete {

  padding: 11px 13px;

}

button.recipe-button {

  font-size: 15px;
  font-weight: bold;
  margin-bottom: 10px;
}

button.save-recipe {

  border: 0;
  background: #e69765;
  color: white;
  padding: 13px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
}

button.edit-recipe {
  width: 100%;
  border: 0;
  background: #e69765;
  color: white;
  padding: 13px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 10px;
}

button.cancel-edit {
  width: 100%;
  border: 0;
  background: #eee;
  color: #8a4d3b;
  padding: 13px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
  margin-top: 10px;
}

button.back-button {
  border: 0;
  background: #fff0e5;
  color: #8a573d;
  padding: 10px 15px;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 15px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  margin: 7px 0 12px;
  border: 1px solid #ead8cc;
  border-radius: 12px;
  font-size: 16px;
  background: white;
  font-family: inherit;
}

select {
  cursor: pointer;
}

textarea {

}

.hidden {
  display: none !important;

.empty,

.today-person {

.today-time {
  text-align: center;

  color: #987d70;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 5px;
  margin-bottom: 15px;
}

.category-option {
  border: 1px solid #ead8cc;

  padding: 10px 5px;

  cursor: pointer;
  font-size: 13px;
}

.category-option.selected {
  background: #fff0e5;

}

.category-icon {
  display: block;

.search-box {
  width: 100%;
  padding: 14px 16px;
  margin: 5px 0 15px;

.search-box:focus {

.recipe-section-title {

<body>

<!-- =====================================================
     🔒 密码页面
===================================================== -->

<div id="passwordScreen" class="password-screen">

  <div class="password-card">

    <div class="password-lock">
      🔒
    </div>

    <h1>
      刘太厨房

    <p>

<script>

/* =====================================================
   🔒 网页密码
===================================================== */

const SITE_PASSWORD = "1217LV";

let siteUnlocked = false;


function unlockKitchen() {

  const input =
    document.getElementById(
      "sitePassword"
    );

  const error =
    document.getElementById(
      "passwordError"
    );

  const password =
    input
      ? input.value
      : "";


  if (
    password ===
    SITE_PASSWORD
  ) {

    siteUnlocked = true;

    sessionStorage.setItem(
      "liutai_kitchen_unlocked",
      "yes"
    );


    const screen =
      document.getElementById(
        "passwordScreen"
      );


    if (screen) {

      screen.classList.add(
        "hidden"
      );

    }


    if (error) {

      error.textContent = "";

    }


    if (input) {

      input.value = "";

    }


    renderCategoryOptions();

    renderRecipeCategoryOptions();

    loadFoods();

    loadRecipes();

    loadTodayOrders();

  }

  else {

    if (error) {

      error.textContent =
        "密码错误 ❌";

    }


    if (input) {

      input.value = "";

      input.focus();

    }

  }

}

   Supabase 请求
===================================================== */

function supabaseBaseURL() {

  return String(SUPABASE_URL)
    .trim()
    .replace(/\/+$/, "");

}


function supabaseKey() {

  return String(SUPABASE_KEY).trim();

}


async function supabaseFetch(endpoint, options) {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(function() {

      controller.abort();

    }, 15000);


  const finalOptions =
    options || {};


  try {

    return await fetch(

      supabaseBaseURL() +
      endpoint,

      {

        ...finalOptions,

        cache: "no-store",

        signal:
          controller.signal,

        headers: {

          "apikey":
            supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey(),

          "Cache-Control":
            "no-cache",

          "Pragma":
            "no-cache",

          ...(finalOptions.headers || {})

        }

      }

    );

  }

  catch (error) {

    if (
      error &&
      error.name === "AbortError"
    ) {

      throw new Error(
        "连接数据库超时，请检查 Supabase。"
      );

    }

    throw error;

  }

  finally {

    clearTimeout(timeout);

  }

}

}


function getIngredientCategoryIcon(category) {

  return found

  }

  const found =
    ingredientCategories.find(function(item) {

      return item.name === category;

    });

  return found
    ? found.name
    : "其他";

}

async function addFood() {

      "请先填写食物名字 ❤️"

  if (!selectedCategory) {

      "请选择一个分类 ❤️"
    );

    return;

  }


  const button =
    document.getElementById(
      "saveFoodButton"
    );


  button.disabled = true;

  button.textContent =
    "正在保存……";


  try {

    const response =
      await supabaseFetch(

        "/family_foods",

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body: JSON.stringify({

            name: name,

            category:
              selectedCategory

          })

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      alert(

    selectedCategory = "";

    renderCategoryOptions();


    await loadFoods();


    showPage(
      "foods",
      document.querySelector(
        "nav button"
      )
    );

  }

  catch (error) {

    alert(
      "无法连接数据库 😢\n\n" +
      error.message
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      "保存食物 ❤️";

/* =====================================================
   删除食物
===================================================== */

async function deleteFood(id) {

  const password =
    prompt(
      "请输入删除密码："
    );


  if (password === null) {
    return;
  }


  if (password !== "1") {

    alert(
      "密码错误 ❌"
    );

    return;

  }


  const food =
    foods.find(function(item) {

      return String(item.id) ===
        String(id);

    });


  if (!food) {

    alert(
      "找不到这个食物 😢"
    );

    return;

  }


  const confirmed =
    confirm(

      "确定要删除「" +
      food.name +
      "」吗？\n\n" +

      "只会删除食物。\n" +
      "📖 食谱不会被删除。"

    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await supabaseFetch(

        "/family_foods?id=eq." +
        encodeURIComponent(id),

        {

          method: "DELETE",

          headers: {

            "Prefer":
              "return=representation"

          }

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      alert(
        "删除失败 😢\n\n" +
        text
      );

      return;

    }


    await loadFoods();

  }

  catch (error) {

    alert(
      "删除失败 😢\n\n" +
      error.message
    );

  }

}

===================================================== */

async function loadTodayOrders() {

  if (!siteUnlocked) return;


  const box =
    document.getElementById(
      "todayList"
    );


  if (!box) return;


  box.innerHTML =
    '<div class="loading">正在读取全家今日菜单……</div>';


  try {

    const response =
      await supabaseFetch(

        "/family_orders?select=*&order=created_at.desc",

        {

          method: "GET",

          headers: {

            "Accept":
              "application/json",

            "Cache-Control":
              "no-cache"

          }

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      box.innerHTML = `

        <div class="empty">

          😢 今日菜单读取失败

          <br><br>

          ${escapeHTML(text)}

          <br><br>

          <button
            class="action"
            onclick="loadTodayOrders()">

            🔄 重新读取

          </button>

        </div>

      `;

      return;

    }


    let allOrders = [];


    try {

      allOrders =
        text
          ? JSON.parse(text)
          : [];

    }

    catch (jsonError) {

      box.innerHTML = `

        <div class="empty">

          😢 今日菜单资料格式错误

        </div>

      `;

      return;

    }


    if (!Array.isArray(allOrders)) {

      allOrders = [];

    }


    const now =
      new Date();


    const singaporeDate =
      new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone:
            "Asia/Singapore",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }
      ).format(now);


    const todayOrders =
      allOrders.filter(
        function(order) {

          if (!order.created_at) {
            return false;
          }


          const orderDate =
            new Intl.DateTimeFormat(
              "en-CA",
              {
                timeZone:
                  "Asia/Singapore",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
              }
            ).format(
              new Date(
                order.created_at
              )
            );


          return (
            orderDate ===
            singaporeDate
          );

        }
      );


    renderToday(
      todayOrders
    );

  }

  catch (error) {

    box.innerHTML = `

      <div class="empty">

        😢 今日菜单读取失败

        <br><br>

        ${escapeHTML(
          error.message || ""
        )}

        <br><br>

        <button
          class="action"
          onclick="loadTodayOrders()">

          🔄 再试一次

        </button>

      </div>

    `;

  }

}

function removeNewStep(button) {

  if (!button) return;


  button.parentElement.remove();


  refreshNewStepNumbers();

}


function refreshNewStepNumbers() {

  const rows =
    document.querySelectorAll(
      "#newStepEditor .step-row"
    );


  rows.forEach(
    function(row, index) {

      const number =
        row.querySelector(
          ".step-number"
        );


      if (number) {

        number.textContent =
          index + 1;

      }

    }
  );

}

/* =====================================================
   材料解析
===================================================== */

function parseIngredients(recipe) {

  try {

    if (!recipe.ingredients) {
      return [];
    }


    if (
      Array.isArray(
        recipe.ingredients
      )
    ) {

      return normalizeIngredients(
        recipe.ingredients
      );

    }


    const data =
      JSON.parse(
        recipe.ingredients
      );


    return Array.isArray(data)
      ? normalizeIngredients(data)
      : [];

  }

  catch (error) {

    return [];

  }

}


/* =====================================================
   材料资料标准化
===================================================== */

function normalizeIngredients(items) {

  if (!Array.isArray(items)) {
    return [];
  }


  return items.map(function(item) {

    if (typeof item === "string") {

      return {

        name:
          item,

        amount:
          "",

        category:
          "其他"

      };

    }


    return {

      name:
        item && item.name
          ? item.name
          : "",

      amount:
        item && item.amount
          ? item.amount
          : "",

      category:
        item && item.category
          ? getIngredientCategoryName(
              item.category
            )
          : "其他"

    };

  });

}


/* =====================================================
   做法解析
===================================================== */

function parseInstructions(recipe) {

  try {

    if (!recipe.instructions) {
      return [];
    }


    if (
      Array.isArray(
        recipe.instructions
      )
    ) {

      return recipe.instructions;

    }


    const data =
      JSON.parse(
        recipe.instructions
      );


    return Array.isArray(data)
      ? data
      : [];

  }

  catch (error) {

    return [];

  }

}


/* =====================================================
   Link
===================================================== */

function normalizeRecipeLink(link) {

  const value =
    String(link || "").trim();


  if (!value) {
    return "";
  }


  if (
    value.startsWith("https://") ||
    value.startsWith("http://")
  ) {

    return value;

  }


  return "https://" + value;

}


/* =====================================================
   材料分组
===================================================== */

function groupIngredients(ingredients) {

  const groups = {};


  ingredientCategories.forEach(
    function(category) {

      groups[category.name] = [];

    }
  );


  ingredients.forEach(
    function(item) {

      const category =
        getIngredientCategoryName(
          item.category
        );


      if (!groups[category]) {

        groups[category] = [];

      }


      groups[category].push(
        item
      );

    }
  );


  return groups;

}


/* =====================================================
   显示材料分类
===================================================== */

function renderIngredientsView(ingredients) {

  if (!ingredients.length) {

    return `

      <div class="view-only-empty">
        暂时没有材料
      </div>

    `;

  }


  const groups =
    groupIngredients(
      ingredients
    );


  let html = "";


  ingredientCategories.forEach(
    function(category) {

      const items =
        groups[category.name];


      if (!items || !items.length) {
        return;
      }


      html += `

        <div class="ingredient-group">

          <div class="ingredient-category-label">

            ${category.icon}

            ${escapeHTML(category.name)}

          </div>

          ${
            items.map(
              function(item) {

                return `

                  <div class="view-only-ingredient">

                    <div class="view-only-ingredient-left">

                      <strong>
                        ${escapeHTML(
                          item.name || ""
                        )}
                      </strong>

                    </div>

                    ${
                      item.amount
                        ? `

                          <div class="view-only-ingredient-amount">

                            ${escapeHTML(
                              item.amount
                            )}

                          </div>

                        `
                        : ""
                    }

                  </div>

                `;

              }
            ).join("")
          }

        </div>

      `;

    }
  );


  return html;

}

    typeof item === "string"
      ? ""
      : (item.amount || "");


  const category =
    typeof item === "string"

      : getIngredientCategoryName(

  return `

    <div class="ingredient-row">

      <input
        class="ingredient-name"
        placeholder="材料，例如：鸡腿肉"

      "stepEditor"
    );

  const index =
    box.children.length;


  const div =
    document.createElement(
      "div"
    );


  div.innerHTML =
    stepEditorHTML(
      "",
      index
    );


  box.appendChild(
    div.firstElementChild
  );


  refreshStepNumbers();

function removeStep(button) {

  if (!button) return;


  button.parentElement.remove();


  refreshStepNumbers();

}


function refreshStepNumbers() {

  const rows =
    document.querySelectorAll(
      "#stepEditor .step-row"
    );


  rows.forEach(
    function(row, index) {

      const number =
        row.querySelector(
          ".step-number"
        );


      if (number) {

        number.textContent =
          index + 1;

      }

    }
  );

}

      "#ingredientEditor .ingredient-row"
    );


  const ingredients = [];


  ingredientRows.forEach(

        );

        row.querySelector(

        );

        );


      const name =
        nameInput
          ? nameInput.value.trim()
          : "";


      const amount =
        amountInput
          ? amountInput.value.trim()
          : "";


      const category =
        categorySelect
          ? categorySelect.value
          : "其他";


      if (name || amount) {

        ingredients.push({

          name:
            name,

          amount:
            amount,

          category:
            category

        });

      }

    }
  );


  const stepRows =
    document.querySelectorAll(
      "#stepEditor .step-row"
    );


  const instructions = [];


  stepRows.forEach(
    function(row) {

      const text =
        row.querySelector(
          ".step-text"
        ).value.trim();


      if (text) {

        instructions.push(text);

      }

    }
  );


  const recipeLinkInput =
    document.getElementById(
      "recipeLink"
    );


  const recipeLink =
    recipeLinkInput
      ? recipeLinkInput.value.trim()
      : "";


  try {

    const response =
      await supabaseFetch(

        "/family_recipes?id=eq." +
        encodeURIComponent(
          currentRecipe.id
        ),

        {

          method: "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body: JSON.stringify({

            ingredients:
              JSON.stringify(
                ingredients
              ),

            instructions:
              JSON.stringify(
                instructions
              ),

            recipe_link:
              recipeLink ||
              null

          })

        }

      );

      await response.text();

        text
      );

      return;

    }


    alert(
      "食谱保存成功 ❤️"
    );


    await loadRecipes();


    const updated =
      recipes.find(
        function(item) {

          return String(item.id) ===

        }
      );


    if (updated) {

      currentRecipe =

    }

  }

  catch (error) {

    alert(
      "无法连接数据库 😢\n\n" +

    );

        document.getElementById(
          pageName
        );


      if (section) {

        section.classList.add(
          "hidden"
        );

      }

    }
  );


  const target =
    document.getElementById(
      page
    );


  if (target) {

    target.classList.remove(
      "hidden"
    );

  }


  document
    .querySelectorAll(
      "nav button"
    )
    .forEach(
      function(btn) {

        btn.classList.remove(
          "active"
        );

      }
    );


  if (button) {

    button.classList.add(
      "active"
    );

  }


  if (page === "foods") {

    loadFoods();

  }


  if (page === "addFood") {

    renderCategoryOptions();

  }


  if (page === "today") {

    loadTodayOrders();

  }


  if (page === "cookbook") {

    loadRecipes();

  }


  if (page === "addRecipe") {

    renderRecipeCategoryOptions();

  }

}


/* =====================================================
   安全显示
===================================================== */

function escapeHTML(text) {

  return String(
    text ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   启动
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const unlocked =
      sessionStorage.getItem(
        "liutai_kitchen_unlocked"
      ) === "yes";


    if (unlocked) {

      siteUnlocked = true;


      const screen =
        document.getElementById(
          "passwordScreen"
        );


      if (screen) {

        screen.classList.add(
          "hidden"
        );

      }


      renderCategoryOptions();

      renderRecipeCategoryOptions();

      loadFoods();

      loadRecipes();

      loadTodayOrders();

    }

    else {

      const input =
        document.getElementById(
          "sitePassword"
        );


      if (input) {

        setTimeout(
          function() {

            input.focus();

          },
          100
        );

      }

    }

  }
);


/* =====================================================
   手机从后台回来时重新读取
===================================================== */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      siteUnlocked &&
      document.visibilityState ===
      "visible"
    ) {

      loadTodayOrders();

    }

  }
);


/* =====================================================
   每 20 秒自动同步今日菜单
===================================================== */

setInterval(
  function() {

    if (siteUnlocked) {

      loadTodayOrders();

    }

  },
  20000
);

</script>

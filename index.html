<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刘太厨房</title>
<style>
body {
  margin: 0;
  background: #fff8f2;
  color: #3d2b24;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
}
header {
  background: #f4c4a4;
  text-align: center;
  padding: 28px 20px;
}
header h1 {
  margin: 0;
  font-size: 30px;
}
header p {
  margin: 8px 0 0;
}
nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 15px;
  background: white;
  overflow-x: auto;
}
nav button {
  border: 0;
  border-radius: 20px;
  padding: 10px 15px;
  background: #fff0e5;
  color: #8a573d;
  white-space: nowrap;
  cursor: pointer;
  font-size: 15px;
}
nav button.active {
  background: #e69765;
  color: white;
}
main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}
.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}
.food-icon {
  font-size: 52px;
  text-align: center;
  margin-bottom: 5px;
}
.food-name {
  text-align: center;
  margin: 5px 0 10px;
  font-size: 23px;
}
.tag {
  display: block;
  width: fit-content;
  margin: 0 auto 15px;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 13px;
}
.action-row {
  display: flex;
  gap: 8px;
}
button.action {
  flex: 1;
  border: 0;
  background: #e69765;
  color: white;
  padding: 11px 10px;
  border-radius: 14px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}
button.delete {
  border: 0;
  background: #eee;
  padding: 9px 13px;
  border-radius: 12px;
  cursor: pointer;
  color: #8a4d3b;
  width: 100%;
}
input,
select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 7px 0 16px;
  border: 1px solid #ead8cc;
  border-radius: 12px;
  font-size: 16px;
  background: white;
}
.hidden {
  display: none;
}
.empty,
.loading {
  text-align: center;
  padding: 35px;
  color: #987d70;
}
.today-person {
  font-size: 15px;
  margin: 8px 0;
}
.today-time {
  font-size: 13px;
  color: #987d70;
}
.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 5px;
  margin-bottom: 15px;
}
.category-option {
  border: 1px solid #ead8cc;
  background: #fffaf7;
  border-radius: 14px;
  padding: 10px 5px;
  text-align: center;
  cursor: pointer;
  font-size: 13px;
}
.category-option.selected {
  background: #fff0e5;
  border: 2px solid #e69765;
}
.category-icon {
  display: block;
  font-size: 28px;
  margin-bottom: 3px;
}
@media (max-width: 420px) {
  .category-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .food-icon {
    font-size: 48px;
  }
}
</style>
</head>
<body>
<header>
  <h1>🍳 刘太厨房</h1>
  <p>一家人的点菜</p>
</header>
<nav>
  <button
    class="active"
    onclick="showPage('recipes', this)">
    🍽️ 食物
  </button>
  <button
    onclick="showPage('add', this)">
    ➕ 添加食物
  </button>
  <button
    onclick="showPage('today', this)">
    📋 今日菜单
  </button>
</nav>
<main>
<section id="recipes">
  <h2>🍽️ 刘太食物</h2>
  <div id="recipeList">
    <div class="loading">
      正在读取食物……
    </div>
  </div>
</section>
<section id="add" class="hidden">
  <h2>➕ 添加食物</h2>
  <div class="card">
    <label>食物名字</label>
    <input
      id="recipeName"
      placeholder="例如：黑椒鸡扒">
    <label>选择分类</label>
    <div
      id="categoryGrid"
      class="category-grid">
    </div>
    <button
      class="action"
      id="saveButton"
      onclick="addRecipe()">
      保存食物 ❤️
    </button>
  </div>
</section>
<section id="today" class="hidden">
  <h2>📋 今日菜单</h2>
  <div id="todayList">
    <div class="loading">
      正在读取今日菜单……
    </div>
  </div>
</section>
</main>
<script>
/* =====================================================
   ⭐ SUPABASE
   =====================================================
   ⚠️ 只改下面两行。
   把你现在已经成功使用的真实 URL 和 Key
   原样放进去。
   URL 例如：
   https://你的项目.supabase.co/rest/v1
   不要在这里加第二个 /rest/v1
   ===================================================== */
const SUPABASE_URL = "https://vgkjqpzktytadjavgzzn.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_4ULyasIw_XqkjnLYbs90LA_MVrn1Ami";
let recipes = [];
let selectedCategory = "";
/* =====================================================
   分类
   ===================================================== */
const categories = [
  {
    name: "鸡肉",
    icon: "🐔"
  },
  {
    name: "猪肉",
    icon: "🐷"
  },
  {
    name: "牛肉",
    icon: "🐮"
  },
  {
    name: "鸡蛋",
    icon: "🥚"
  },
  {
    name: "鱼",
    icon: "🐟"
  },
  {
    name: "海鲜",
    icon: "🦐"
  },
  {
    name: "蔬菜",
    icon: "🥬"
  },
  {
    name: "饭",
    icon: "🍚"
  },
  {
    name: "面食",
    icon: "🍜"
  },
  {
    name: "意大利面",
    icon: "🍝"
  },
  {
    name: "汤",
    icon: "🍲"
  },
  {
    name: "点心",
    icon: "🥟"
  },
  {
    name: "甜点",
    icon: "🍰"
  },
  {
    name: "早餐",
    icon: "🍳"
  },
  {
    name: "其他",
    icon: "🍽️"
  }
];
/* =====================================================
   Supabase URL
   ===================================================== */
function supabaseBaseURL() {
  return String(SUPABASE_URL)
    .trim()
    .replace(/\/+$/, "");
}
/* =====================================================
   Supabase Key
   ===================================================== */
function supabaseKey() {
  return String(SUPABASE_KEY)
    .trim();
}
/* =====================================================
   分类图案
   ===================================================== */
function getCategoryIcon(category) {
  const found =
    categories.find(function(item) {
      return item.name === category;
    });
  if (found) {
    return found.icon;
  }
  return "🍽️";
}
/* =====================================================
   显示分类选择
   ===================================================== */
function renderCategoryOptions() {
  const box =
    document.getElementById("categoryGrid");
  box.innerHTML =
    categories.map(function(category) {
      const selected =
        selectedCategory === category.name
          ? "selected"
          : "";
      return `
        <button
          type="button"
          class="category-option ${selected}"
          onclick="selectCategory('${category.name}')">
          <span class="category-icon">
            ${category.icon}
          </span>
          ${category.name}
        </button>
      `;
    }).join("");
}
/* =====================================================
   选择分类
   ===================================================== */
function selectCategory(category) {
  selectedCategory = category;
  renderCategoryOptions();
}
/* =====================================================
   读取食物
   ===================================================== */
async function loadRecipes() {
  const box =
    document.getElementById("recipeList");
  box.innerHTML =
    '<div class="loading">正在读取食物……</div>';
  try {
    const url =
      supabaseBaseURL() +
      "/family_recipes?select=*&order=created_at.desc";
    console.log(
      "Reading recipes:",
      url
    );
    const key =
      supabaseKey();
    const response =
      await fetch(url, {
        method: "GET",
        headers: {
          "apikey": key,
          "Authorization":
            "Bearer " + key
        }
      });
    if (!response.ok) {
      const errorText =
        await response.text();
      console.error(
        "Supabase recipe error:",
        response.status,
        errorText
      );
      box.innerHTML =
        '<div class="empty">食物读取失败 😢</div>';
      return;
    }
    recipes =
      await response.json();
    renderRecipes();
  }
  catch (error) {
    console.error(
      "Recipe connection error:",
      error
    );
    box.innerHTML =
      '<div class="empty">食物读取失败 😢</div>';
  }
}
/* =====================================================
   显示食物
   ===================================================== */
function renderRecipes() {
  const box =
    document.getElementById("recipeList");
  if (!recipes.length) {
    box.innerHTML =
      '<div class="empty">还没有食物 😊<br>点击「➕ 添加食物」开始吧！</div>';
    return;
  }
  box.innerHTML =
    recipes.map(function(recipe) {
      const icon =
        getCategoryIcon(recipe.category);
      return `
        <div class="card">
          <div class="food-icon">
            ${icon}
          </div>
          <h2 class="food-name">
            ${escapeHTML(recipe.name)}
          </h2>
          <span class="tag">
            ${icon}
            ${escapeHTML(recipe.category || "其他")}
          </span>
          <div class="action-row">
            <button
              class="action"
              onclick="orderRecipe('${recipe.id}')">
              ❤️ 我要吃
            </button>
          </div>
          <br>
          <button
            class="delete"
            onclick="deleteRecipe('${recipe.id}')">
            🗑️ 删除食物
          </button>
        </div>
      `;
    }).join("");
}
/* =====================================================
   添加食物
   ===================================================== */
async function addRecipe() {
  const name =
    document
      .getElementById("recipeName")
      .value
      .trim();
  if (!name) {
    alert(
      "请先填写食物名字 ❤️"
    );
    return;
  }
  if (!selectedCategory) {
    alert(
      "请选择一个分类 ❤️"
    );
    return;
  }
  const saveButton =
    document.getElementById("saveButton");
  saveButton.disabled = true;
  saveButton.textContent =
    "正在保存……";
  try {
    const url =
      supabaseBaseURL() +
      "/family_recipes";
    const key =
      supabaseKey();
    const response =
      await fetch(url, {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization":
            "Bearer " + key,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=representation"
        },
        body: JSON.stringify({
          name: name,
          category: selectedCategory,
          ingredients: "",
          instructions: ""
        })
      });
    if (!response.ok) {
      const errorText =
        await response.text();
      console.error(
        "Save error:",
        response.status,
        errorText
      );
      alert(
        "保存失败 😢\n" +
        errorText
      );
      return;
    }
    alert(
      "食物保存成功 ❤️"
    );
    document
      .getElementById("recipeName")
      .value = "";
    selectedCategory = "";
    renderCategoryOptions();
    await loadRecipes();
    showPage(
      "recipes",
      document.querySelector("nav button")
    );
  }
  catch (error) {
    console.error(
      "Save connection error:",
      error
    );
    alert(
      "无法连接数据库 😢"
    );
  }
  finally {
    saveButton.disabled = false;
    saveButton.textContent =
      "保存食物 ❤️";
  }
}
/* =====================================================
   删除食物
   密码：1
   ===================================================== */
async function deleteRecipe(id) {
  const password =
    prompt(
      "请输入删除密码："
    );
  if (password === null) {
    return;
  }
  if (password !== "1") {
    alert(
      "密码错误 ❌"
    );
    return;
  }
  const confirmDelete =
    confirm(
      "确定要删除这个食物吗？"
    );
  if (!confirmDelete) {
    return;
  }
  try {
    const url =
      supabaseBaseURL() +
      "/family_recipes?id=eq." +
      encodeURIComponent(id);
    const key =
      supabaseKey();
    const response =
      await fetch(url, {
        method: "DELETE",
        headers: {
          "apikey": key,
          "Authorization":
            "Bearer " + key
        }
      });
    if (!response.ok) {
      const errorText =
        await response.text();
      console.error(
        "Delete recipe error:",
        response.status,
        errorText
      );
      alert(
        "删除失败 😢\n" +
        errorText
      );
      return;
    }
    alert(
      "食物已经删除 ❤️"
    );
    await loadRecipes();
  }
  catch (error) {
    console.error(
      "Delete recipe connection error:",
      error
    );
    alert(
      "删除失败 😢"
    );
  }
}
/* =====================================================
   ❤️ 我点 / 老公点
   ===================================================== */
async function orderRecipe(id) {
  const recipe =
    recipes.find(function(item) {
      return String(item.id) ===
        String(id);
    });
  if (!recipe) {
    return;
  }
  const choice =
    prompt(
      "谁点这道菜？\n\n输入：我 或 老公"
    );
  if (choice === null) {
    return;
  }
  const person =
    choice.trim();
  if (
    person !== "我" &&
    person !== "老公"
  ) {
    alert(
      "请输入「我」或「老公」 ❤️"
    );
    return;
  }
  try {
    const url =
      supabaseBaseURL() +
      "/family_orders";
    const key =
      supabaseKey();
    const response =
      await fetch(url, {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization":
            "Bearer " + key,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=representation"
        },
        body: JSON.stringify({
          recipe_name:
            recipe.name,
          order_by:
            person
        })
      });
    if (!response.ok) {
      const errorText =
        await response.text();
      console.error(
        "Order error:",
        response.status,
        errorText
      );
      alert(
        "加入今日菜单失败 😢\n" +
        errorText
      );
      return;
    }
    alert(
      recipe.name +
      " 已加入今日菜单 ❤️"
    );
    await loadTodayOrders();
  }
  catch (error) {
    console.error(
      "Order connection error:",
      error
    );
    alert(
      "无法连接今日菜单 😢"
    );
  }
}
/* =====================================================
   📋 读取共享今日菜单
   ===================================================== */
async function loadTodayOrders() {
  const box =
    document.getElementById("todayList");
  box.innerHTML =
    '<div class="loading">正在读取今日菜单……</div>';
  try {
    const url =
      supabaseBaseURL() +
      "/family_orders?select=*&order=created_at.desc";
    console.log(
      "Reading today's orders:",
      url
    );
    const key =
      supabaseKey();
    const response =
      await fetch(url, {
        method: "GET",
        headers: {
          "apikey": key,
          "Authorization":
            "Bearer " + key
        }
      });
    if (!response.ok) {
      const errorText =
        await response.text();
      console.error(
        "Today orders error:",
        response.status,
        errorText
      );
      box.innerHTML =
        '<div class="empty">今日菜单读取失败 😢</div>';
      return;
    }
    const allOrders =
      await response.json();
    const today =
      new Date();
    const todayYear =
      today.getFullYear();
    const todayMonth =
      today.getMonth();
    const todayDate =
      today.getDate();
    const orders =
      allOrders.filter(function(order) {
        if (!order.created_at) {
          return false;
        }
        const orderDate =
          new Date(order.created_at);
        return (
          orderDate.getFullYear() ===
            todayYear
          &&
          orderDate.getMonth() ===
            todayMonth
          &&
          orderDate.getDate() ===
            todayDate
        );
      });
    renderToday(orders);
  }
  catch (error) {
    console.error(
      "Today orders connection error:",
      error
    );
    box.innerHTML =
      '<div class="empty">今日菜单读取失败 😢</div>';
  }
}
/* =====================================================
   显示今日菜单
   ===================================================== */
function renderToday(orders) {
  const box =
    document.getElementById("todayList");
  if (!orders.length) {
    box.innerHTML =
      '<div class="empty">今天还没有人点菜 😊</div>';
    return;
  }
  box.innerHTML =
    orders.map(function(item) {
      const icon =
        getIconFromFoodName(item.recipe_name);
      const time =
        item.created_at
          ? new Date(
              item.created_at
            ).toLocaleTimeString(
              "zh-CN",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            )
          : "";
      return `
        <div class="card">
          <div class="food-icon">
            ${icon}
          </div>
          <h2 class="food-name">
            ${escapeHTML(item.recipe_name)}
          </h2>
          <div class="today-person">
            ❤️
            ${escapeHTML(item.order_by || "家人")}
          </div>
          <div class="today-time">
            点菜时间：
            ${escapeHTML(time)}
          </div>
          <br>
          <button
            class="delete"
            onclick="removeOrder('${item.id}')">
            取消
          </button>
        </div>
      `;
    }).join("");
}
/* =====================================================
   根据食物名字寻找图案
   ===================================================== */
function getIconFromFoodName(name) {
  const recipe =
    recipes.find(function(item) {
      return item.name === name;
    });
  if (recipe) {
    return getCategoryIcon(
      recipe.category
    );
  }
  return "🍽️";
}
/* =====================================================
   取消今日菜单
   ===================================================== */
async function removeOrder(id) {
  const confirmRemove =
    confirm(
      "确定取消这道菜吗？"
    );
  if (!confirmRemove) {
    return;
  }
  try {
    const url =
      supabaseBaseURL() +
      "/family_orders?id=eq." +
      encodeURIComponent(id);
    const key =
      supabaseKey();
    const response =
      await fetch(url, {
        method: "DELETE",
        headers: {
          "apikey": key,
          "Authorization":
            "Bearer " + key
        }
      });
    if (!response.ok) {
      const errorText =
        await response.text();
      console.error(
        "Remove order error:",
        response.status,
        errorText
      );
      alert(
        "取消失败 😢\n" +
        errorText
      );
      return;
    }
    await loadTodayOrders();
  }
  catch (error) {
    console.error(
      "Remove order connection error:",
      error
    );
    alert(
      "无法连接数据库 😢"
    );
  }
}
/* =====================================================
   页面切换
   ===================================================== */
function showPage(page, button) {
  document
    .getElementById("recipes")
    .classList.add("hidden");
  document
    .getElementById("add")
    .classList.add("hidden");
  document
    .getElementById("today")
    .classList.add("hidden");
  document
    .getElementById(page)
    .classList.remove("hidden");
  document
    .querySelectorAll("nav button")
    .forEach(function(btn) {
      btn.classList.remove("active");
    });
  button.classList.add("active");
  if (page === "recipes") {
    loadRecipes();
  }
  if (page === "add") {
    renderCategoryOptions();
  }
  if (page === "today") {
    loadTodayOrders();
  }
}
/* =====================================================
   安全显示文字
   ===================================================== */
function escapeHTML(text) {
  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}
/* =====================================================
   启动
   ===================================================== */
renderCategoryOptions();
loadRecipes();
loadTodayOrders();
</script>
</body>
</html>

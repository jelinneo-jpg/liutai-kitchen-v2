<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>刘太厨房</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8f2;
  color: #3d2b24;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
}

header {
  background: #f4c4a4;
  text-align: center;
  padding: 28px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 15px;
  background: white;
  overflow-x: auto;
}

nav button {
  border: 0;
  border-radius: 20px;
  padding: 10px 15px;
  background: #fff0e5;
  color: #8a573d;
  white-space: nowrap;
  cursor: pointer;
  font-size: 15px;
}

nav button.active {
  background: #e69765;
  color: white;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.food-icon {
  font-size: 52px;
  text-align: center;
  margin-bottom: 5px;
}

.food-name {
  text-align: center;
  margin: 5px 0 10px;
  font-size: 23px;
}

.tag {
  display: block;
  width: fit-content;
  margin: 0 auto 15px;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 13px;
}

.action-row {
  display: flex;
  gap: 8px;
}

button.action {
  flex: 1;
  border: 0;
  background: #e69765;
  color: white;
  padding: 12px 10px;
  border-radius: 14px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

button.action.husband {
  background: #d58b68;
}

button.delete {
  border: 0;
  background: #eee;
  padding: 11px 13px;
  border-radius: 12px;
  cursor: pointer;
  color: #8a4d3b;
  width: 100%;
  font-size: 14px;
}

button.recipe-button {
  width: 100%;
  border: 0;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 12px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 10px;
}

button.save-recipe {
  width: 100%;
  border: 0;
  background: #e69765;
  color: white;
  padding: 13px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
}

button.back-button {
  border: 0;
  background: #fff0e5;
  color: #8a573d;
  padding: 10px 15px;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 15px;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  margin: 7px 0 12px;
  border: 1px solid #ead8cc;
  border-radius: 12px;
  font-size: 16px;
  background: white;
  font-family: inherit;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.hidden {
  display: none;
}

.empty,
.loading {
  text-align: center;
  padding: 35px;
  color: #987d70;
}

.today-person {
  text-align: center;
  font-size: 16px;
  margin: 8px 0;
}

.today-time {
  text-align: center;
  font-size: 13px;
  color: #987d70;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 5px;
  margin-bottom: 15px;
}

.category-option {
  border: 1px solid #ead8cc;
  background: #fffaf7;
  border-radius: 14px;
  padding: 10px 5px;
  text-align: center;
  cursor: pointer;
  font-size: 13px;
}

.category-option.selected {
  background: #fff0e5;
  border: 2px solid #e69765;
}

.category-icon {
  display: block;
  font-size: 28px;
  margin-bottom: 3px;
}

#foodSearch {
  width: 100%;
  padding: 14px 16px;
  margin: 5px 0 10px;
  border: 1px solid #ead8cc;
  border-radius: 15px;
  font-size: 16px;
  background: white;
  outline: none;
}

#foodSearch:focus {
  border-color: #e69765;
  box-shadow: 0 0 0 3px rgba(230,151,101,.12);
}

.search-result-count {
  text-align: center;
  color: #987d70;
  font-size: 13px;
  margin: 0 0 15px;
}

.recipe-section-title {
  font-size: 20px;
  margin: 20px 0 12px;
}

.ingredient-row {
  display: flex;
  gap: 8px;
  margin-bottom: 9px;
  align-items: center;
}

.ingredient-row input:first-child {
  flex: 1.3;
}

.ingredient-row input:nth-child(2) {
  flex: 1;
}

.step-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 9px;
}

.step-number {
  width: 32px;
  min-width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #fff0e5;
  color: #9a5e3d;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.step-row textarea {
  margin: 0;
  min-height: 48px;
  flex: 1;
}

.small-delete {
  width: 38px;
  min-width: 38px;
  height: 38px;
  border: 0;
  border-radius: 10px;
  background: #f1eeee;
  cursor: pointer;
  font-size: 16px;
}

.add-row-button {
  width: 100%;
  border: 1px dashed #d8ad96;
  background: #fffaf7;
  color: #9a5e3d;
  padding: 11px;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 15px;
  font-size: 14px;
}

.recipe-title {
  text-align: center;
  font-size: 26px;
  margin: 5px 0 8px;
}

.recipe-category {
  text-align: center;
  color: #987d70;
  margin-bottom: 20px;
}

.recipe-list-card {
  cursor: pointer;
}

.recipe-link-box {
  display: block;
  width: 100%;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 13px;
  border-radius: 14px;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  margin-bottom: 15px;
}

@media (max-width: 420px) {
  .food-icon {
    font-size: 48px;
  }

  .ingredient-row {
    gap: 5px;
  }

  .ingredient-row input {
    min-width: 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>🍳 刘太厨房</h1>
  <p>一家人的点菜 ❤️</p>
</header>

<nav>
  <button class="active" onclick="showPage('recipes', this)">
    🍽️ 食物
  </button>

  <button onclick="showPage('add', this)">
    ➕ 添加食物
  </button>

  <button onclick="showPage('today', this)">
    📋 今日菜单
  </button>

  <button onclick="showPage('cookbook', this)">
    📖 食谱
  </button>
</nav>

<main>

<section id="recipes">

  <h2>🍽️ 刘太食物</h2>

  <input
    id="foodSearch"
    type="search"
    placeholder="🔍 搜索食物，例如：鸡、汤、意大利面"
    oninput="searchFood()">

  <div id="recipeList">
    <div class="loading">
      正在读取食物……
    </div>
  </div>

</section>


<section id="add" class="hidden">

  <h2>➕ 添加食物</h2>

  <div class="card">

    <label>食物名字</label>

    <input
      id="recipeName"
      placeholder="例如：黑椒鸡扒">

    <label>选择分类</label>

    <div
      id="categoryGrid"
      class="category-grid">
    </div>

    <button
      class="save-recipe"
      id="saveButton"
      onclick="addRecipe()">

      保存食物 ❤️

    </button>

  </div>

</section>


<section id="today" class="hidden">

  <h2>📋 今日菜单</h2>

  <div id="todayList">
    <div class="loading">
      正在读取今日菜单……
    </div>
  </div>

</section>


<section id="cookbook" class="hidden">

  <h2>📖 刘太食谱</h2>

  <div id="cookbookList">
    <div class="loading">
      正在读取食谱……
    </div>
  </div>

</section>


<section id="recipeDetail" class="hidden">

  <button
    class="back-button"
    onclick="backToCookbook()">

    ← 返回食谱

  </button>

  <div id="recipeDetailContent"></div>

</section>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://vgkjqpzktytadjavgzzn.supabase.co/rest/v1";

const SUPABASE_KEY =
  "sb_publishable_4ULyasIw_XqkjnLYbs90LA_MVrn1Ami";


let recipes = [];
let selectedCategory = "";
let currentRecipe = null;


/* =====================================================
   分类
===================================================== */

const categories = [
  { name: "鸡肉", icon: "🐔" },
  { name: "猪肉", icon: "🐷" },
  { name: "牛肉", icon: "🐮" },
  { name: "鸡蛋", icon: "🥚" },
  { name: "鱼", icon: "🐟" },
  { name: "海鲜", icon: "🦐" },
  { name: "蔬菜", icon: "🥬" },
  { name: "饭", icon: "🍚" },
  { name: "面食", icon: "🍜" },
  { name: "意大利面", icon: "🍝" },
  { name: "汤", icon: "🍲" },
  { name: "点心", icon: "🥟" },
  { name: "甜点", icon: "🍰" },
  { name: "早餐", icon: "🍳" },
  { name: "其他", icon: "🍽️" }
];


/* =====================================================
   安全文字
===================================================== */

function escapeHTML(text) {

  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   Supabase
===================================================== */

function supabaseBaseURL() {

  return String(SUPABASE_URL)
    .trim()
    .replace(/\/+$/, "");

}


function supabaseKey() {

  return String(SUPABASE_KEY)
    .trim();

}


/* =====================================================
   Supabase 请求
===================================================== */

async function supabaseFetch(endpoint, options) {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(function() {

      controller.abort();

    }, 15000);


  try {

    const requestOptions =
      options || {};

    const headers =
      Object.assign(
        {
          "apikey":
            supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey()
        },

        requestOptions.headers || {}
      );


    return await fetch(

      supabaseBaseURL() + endpoint,

      Object.assign(
        {},
        requestOptions,
        {
          signal:
            controller.signal,

          headers:
            headers
        }
      )

    );

  }

  catch (error) {

    if (
      error &&
      error.name === "AbortError"
    ) {

      throw new Error(
        "连接数据库超时，请检查 Supabase。"
      );

    }

    throw error;

  }

  finally {

    clearTimeout(timeout);

  }

}


/* =====================================================
   分类图标
===================================================== */

function getCategoryIcon(category) {

  const found =
    categories.find(function(item) {

      return item.name === category;

    });


  return found
    ? found.icon
    : "🍽️";

}


/* =====================================================
   分类按钮
===================================================== */

function renderCategoryOptions() {

  const box =
    document.getElementById(
      "categoryGrid"
    );


  if (!box) {
    return;
  }


  box.innerHTML =
    categories.map(function(category) {

      const selected =
        selectedCategory === category.name
          ? "selected"
          : "";


      return `

        <button
          type="button"
          class="category-option ${selected}"
          onclick="selectCategory('${escapeHTML(category.name)}')">

          <span class="category-icon">
            ${category.icon}
          </span>

          ${escapeHTML(category.name)}

        </button>

      `;

    }).join("");

}


/* =====================================================
   选择分类
===================================================== */

function selectCategory(category) {

  selectedCategory =
    category;

  renderCategoryOptions();

}


/* =====================================================
   🍽️ 读取食物
===================================================== */

async function loadRecipes() {

  const box =
    document.getElementById(
      "recipeList"
    );


  if (!box) {
    return;
  }


  box.innerHTML =
    '<div class="loading">正在读取食物……</div>';


  try {

    const response =
      await supabaseFetch(

        "/family_recipes?select=*&order=created_at.desc",

        {
          method: "GET"
        }

      );


    const text =
      await response.text();


    console.log(
      "Supabase food response:",
      response.status,
      text
    );


    if (!response.ok) {

      box.innerHTML = `

        <div class="empty">

          😢 食物读取失败

          <br><br>

          <small>
            ${escapeHTML(text)}
          </small>

          <br><br>

          <button
            class="action"
            onclick="loadRecipes()">

            🔄 重新读取

          </button>

        </div>

      `;

      return;

    }


    let data = [];


    try {

      data =
        text
          ? JSON.parse(text)
          : [];

    }

    catch (error) {

      console.error(
        "JSON error:",
        error
      );


      box.innerHTML = `

        <div class="empty">

          😢 数据格式读取失败

          <br><br>

          <button
            class="action"
            onclick="loadRecipes()">

            🔄 重新读取

          </button>

        </div>

      `;

      return;

    }


    recipes =
      Array.isArray(data)
        ? data
        : [];


    renderRecipes();

    renderCookbook();

  }

  catch (error) {

    console.error(
      "loadRecipes error:",
      error
    );


    box.innerHTML = `

      <div class="empty">

        😢 无法读取食物

        <br><br>

        <small>
          ${escapeHTML(
            error.message ||
            "数据库连接失败"
          )}
        </small>

        <br><br>

        <button
          class="action"
          onclick="loadRecipes()">

          🔄 再试一次

        </button>

      </div>

    `;

  }

}


/* =====================================================
   🍽️ 显示食物
===================================================== */

function renderRecipes(list) {

  const box =
    document.getElementById(
      "recipeList"
    );


  if (!box) {
    return;
  }


  const data =
    Array.isArray(list)
      ? list
      : recipes;


  if (!data.length) {

    box.innerHTML =
      '<div class="empty">还没有食物 😊<br>点击「➕ 添加食物」开始吧！</div>';

    return;

  }


  box.innerHTML =
    data.map(function(recipe) {

      return recipeCardHTML(
        recipe
      );

    }).join("");

}


/* =====================================================
   食物卡片
===================================================== */

function recipeCardHTML(recipe) {

  const icon =
    getCategoryIcon(
      recipe.category
    );


  const id =
    escapeHTML(
      String(recipe.id)
    );


  return `

    <div class="card">

      <div class="food-icon">
        ${icon}
      </div>

      <h2 class="food-name">
        ${escapeHTML(
          recipe.name ||
          "未命名食物"
        )}
      </h2>

      <span class="tag">

        ${icon}

        ${escapeHTML(
          recipe.category ||
          "其他"
        )}

      </span>


      <div class="action-row">

        <button
          class="action"
          onclick="orderRecipe('${id}', '我')">

          ❤️ 我点

        </button>


        <button
          class="action husband"
          onclick="orderRecipe('${id}', '老公')">

          ❤️ 老公点

        </button>

      </div>


      <br>


      <button
        class="delete"
        onclick="deleteRecipe('${id}')">

        🗑️ 删除食物

      </button>

    </div>

  `;

}


/* =====================================================
   🔍 搜索
===================================================== */

function searchFood() {

  const input =
    document.getElementById(
      "foodSearch"
    );


  if (!input) {
    return;
  }


  const keyword =
    input.value
      .trim()
      .toLowerCase();


  if (!keyword) {

    renderRecipes();

    return;

  }


  const filtered =
    recipes.filter(function(recipe) {

      const name =
        String(
          recipe.name || ""
        ).toLowerCase();


      const category =
        String(
          recipe.category || ""
        ).toLowerCase();


      return (
        name.includes(keyword) ||
        category.includes(keyword)
      );

    });


  const box =
    document.getElementById(
      "recipeList"
    );


  if (!filtered.length) {

    box.innerHTML = `

      <div class="empty">

        😢 找不到「${escapeHTML(keyword)}」

        <br><br>

        试试看其他食物名字或分类

      </div>

    `;

    return;

  }


  box.innerHTML = `

    <div class="search-result-count">

      找到 ${filtered.length} 道食物 ❤️

    </div>

    ${filtered.map(function(recipe) {

      return recipeCardHTML(
        recipe
      );

    }).join("")}

  `;

}


/* =====================================================
   ➕ 添加食物
===================================================== */

async function addRecipe() {

  const nameInput =
    document.getElementById(
      "recipeName"
    );


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  const name =
    nameInput.value.trim();


  if (!name) {

    alert(
      "请先填写食物名字 ❤️"
    );

    return;

  }


  if (!selectedCategory) {

    alert(
      "请选择一个分类 ❤️"
    );

    return;

  }


  saveButton.disabled =
    true;

  saveButton.textContent =
    "正在保存……";


  try {

    const response =
      await supabaseFetch(

        "/family_recipes",

        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({

            name:
              name,

            category:
              selectedCategory,

            ingredients:
              JSON.stringify([]),

            instructions:
              JSON.stringify([]),

            recipe_link:
              null

          })

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      alert(
        "保存失败 😢\n\n" +
        text
      );

      return;

    }


    alert(
      "食物保存成功 ❤️"
    );


    nameInput.value =
      "";

    selectedCategory =
      "";

    renderCategoryOptions();


    await loadRecipes();


    showPage(
      "recipes",
      document.querySelector(
        "nav button"
      )
    );

  }

  catch (error) {

    alert(
      "无法连接数据库 😢\n\n" +
      error.message
    );

  }

  finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      "保存食物 ❤️";

  }

}


/* =====================================================
   🗑️ 删除食物
===================================================== */

async function deleteRecipe(id) {

  const password =
    prompt(
      "请输入删除密码："
    );


  if (password === null) {
    return;
  }


  if (password !== "1") {

    alert(
      "密码错误 ❌"
    );

    return;

  }


  const recipe =
    recipes.find(function(item) {

      return String(item.id) ===
        String(id);

    });


  if (!recipe) {

    alert(
      "找不到这个食物 😢"
    );

    return;

  }


  const confirmDelete =
    confirm(

      "确定要删除「" +
      recipe.name +
      "」吗？\n\n" +
      "删除后食物和保存的食谱资料都会删除。"

    );


  if (!confirmDelete) {
    return;
  }


  try {

    const response =
      await supabaseFetch(

        "/family_recipes?id=eq." +
        encodeURIComponent(id),

        {
          method: "DELETE",

          headers: {
            "Prefer":
              "return=representation"
          }

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      alert(
        "删除失败 😢\n\n" +
        text
      );

      return;

    }


    alert(
      "「" +
      recipe.name +
      "」已经删除 ❤️"
    );


    currentRecipe =
      null;


    await loadRecipes();

  }

  catch (error) {

    alert(
      "删除失败 😢\n\n" +
      error.message
    );

  }

}


/* =====================================================
   ❤️ 点菜
===================================================== */

async function orderRecipe(
  id,
  person
) {

  const recipe =
    recipes.find(function(item) {

      return String(item.id) ===
        String(id);

    });


  if (!recipe) {
    return;
  }


  const confirmOrder =
    confirm(

      "确定要点：\n\n" +
      recipe.name +
      "\n\n点菜人：" +
      person

    );


  if (!confirmOrder) {
    return;
  }


  try {

    const response =
      await supabaseFetch(

        "/family_orders",

        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({

            recipe_name:
              recipe.name,

            ordered_by:
              person

          })

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      alert(
        "加入今日菜单失败 😢\n\n" +
        text
      );

      return;

    }


    alert(
      recipe.name +
      "\n已经加入今日菜单 ❤️"
    );


    await loadTodayOrders();

  }

  catch (error) {

    alert(
      "无法连接今日菜单 😢\n\n" +
      error.message
    );

  }

}


/* =====================================================
   📋 今日菜单
===================================================== */

async function loadTodayOrders() {

  const box =
    document.getElementById(
      "todayList"
    );


  if (!box) {
    return;
  }


  box.innerHTML =
    '<div class="loading">正在读取今日菜单……</div>';


  try {

    const response =
      await supabaseFetch(

        "/family_orders?select=*&order=created_at.desc",

        {
          method: "GET"
        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      box.innerHTML = `

        <div class="empty">

          😢 今日菜单读取失败

          <br><br>

          <small>
            ${escapeHTML(text)}
          </small>

          <br><br>

          <button
            class="action"
            onclick="loadTodayOrders()">

            🔄 重新读取

          </button>

        </div>

      `;

      return;

    }


    let allOrders = [];


    try {

      allOrders =
        text
          ? JSON.parse(text)
          : [];

    }

    catch (error) {

      allOrders = [];

    }


    const today =
      new Date();


    const orders =
      allOrders.filter(
        function(order) {

          if (!order.created_at) {
            return false;
          }


          const date =
            new Date(
              order.created_at
            );


          return (

            date.getFullYear() ===
              today.getFullYear()

            &&

            date.getMonth() ===
              today.getMonth()

            &&

            date.getDate() ===
              today.getDate()

          );

        }
      );


    renderToday(
      orders
    );

  }

  catch (error) {

    box.innerHTML = `

      <div class="empty">

        😢 今日菜单读取失败

        <br><br>

        ${escapeHTML(
          error.message || ""
        )}

        <br><br>

        <button
          class="action"
          onclick="loadTodayOrders()">

          🔄 再试一次

        </button>

      </div>

    `;

  }

}


/* =====================================================
   显示今日菜单
===================================================== */

function renderToday(
  orders
) {

  const box =
    document.getElementById(
      "todayList"
    );


  if (!orders.length) {

    box.innerHTML =
      '<div class="empty">今天还没有人点菜 😊</div>';

    return;

  }


  box.innerHTML =
    orders.map(function(item) {

      const recipe =
        recipes.find(function(r) {

          return r.name ===
            item.recipe_name;

        });


      const icon =
        recipe
          ? getCategoryIcon(
              recipe.category
            )
          : "🍽️";


      const time =
        item.created_at

          ? new Date(
              item.created_at
            ).toLocaleTimeString(
              "zh-CN",
              {
                hour:
                  "2-digit",

                minute:
                  "2-digit"
              }
            )

          : "";


      return `

        <div class="card">

          <div class="food-icon">
            ${icon}
          </div>

          <h2 class="food-name">

            ${escapeHTML(
              item.recipe_name
            )}

          </h2>

          <div class="today-person">

            ❤️
            ${escapeHTML(
              item.ordered_by ||
              "家人"
            )}

          </div>

          <div class="today-time">

            点菜时间：
            ${escapeHTML(time)}

          </div>

          <br>

          <button
            class="delete"
            onclick="removeOrder('${escapeHTML(String(item.id))}')">

            取消

          </button>

        </div>

      `;

    }).join("");

}


/* =====================================================
   取消今日菜单
===================================================== */

async function removeOrder(id) {

  if (!confirm(
    "确定取消这道菜吗？"
  )) {
    return;
  }


  try {

    const response =
      await supabaseFetch(

        "/family_orders?id=eq." +
        encodeURIComponent(id),

        {
          method: "DELETE"
        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      alert(
        "取消失败 😢\n\n" +
        text
      );

      return;

    }


    await loadTodayOrders();

  }

  catch (error) {

    alert(
      "无法连接数据库 😢\n\n" +
      error.message
    );

  }

}


/* =====================================================
   📖 食谱列表
===================================================== */

function renderCookbook() {

  const box =
    document.getElementById(
      "cookbookList"
    );


  if (!box) {
    return;
  }


  if (!recipes.length) {

    box.innerHTML =
      '<div class="empty">还没有食谱 😊<br>先到「添加食物」增加菜吧！</div>';

    return;

  }


  box.innerHTML =
    recipes.map(function(recipe) {

        getCategoryIcon(

        );

        <div

          <div class="food-icon">

          </div>

          <h2 class="food-name">

            ${escapeHTML(
              recipe.name
            )}

          </h2>

          <span class="tag">

            ${icon}

            )}

}


/* =====================================================
   📖 打开食谱
===================================================== */

function openRecipe(id) {

  const recipe =
    recipes.find(function(item) {

      return String(item.id) ===
        String(id);

    });


  if (!recipe) {
    return;
  }


  currentRecipe =
    recipe;


  document
    .getElementById(
      "cookbook"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "recipeDetail"
    )
    .classList.remove(
      "hidden"
    );


  renderRecipeDetail();

}


/* =====================================================
   材料
===================================================== */

function parseIngredients(
  recipe
) {

  try {

    if (!recipe.ingredients) {
      return [];
    }


    if (
      Array.isArray(
        recipe.ingredients
      )
    ) {

      return recipe.ingredients;

    }


    const data =
      JSON.parse(
        recipe.ingredients
      );


    return Array.isArray(data)
      ? data
      : [];

  }

  catch (error) {

    console.error(error);

    return [];

  }

}


/* =====================================================
   做法
===================================================== */

function parseInstructions(
  recipe
) {

  try {

    if (!recipe.instructions) {
      return [];
    }


    if (
      Array.isArray(
        recipe.instructions
      )
    ) {

      return recipe.instructions;

    }


    const data =
      JSON.parse(
        recipe.instructions
      );


    return Array.isArray(data)
      ? data
      : [];

  }

  catch (error) {

    console.error(error);

    return [];

  }

}


/* =====================================================
   Link
===================================================== */

function normalizeRecipeLink(
  link
) {

  const value =
    String(link || "")
      .trim();


  if (!value) {
    return "";
  }


  if (
    value.startsWith(
      "https://"
    )

    ||

    value.startsWith(
      "http://"
    )
  ) {

    return value;

  }


  return "https://" + value;

}


/* =====================================================
   📖 显示食谱
===================================================== */

function renderRecipeDetail() {

  if (!currentRecipe) {
    return;
  }


  const ingredients =
    parseIngredients(
      currentRecipe
    );


  const instructions =
    parseInstructions(
      currentRecipe
    );


  const icon =
    getCategoryIcon(
      currentRecipe.category
    );


  const recipeLink =
    currentRecipe.recipe_link ||
    "";


  const box =
    document.getElementById(
      "recipeDetailContent"
    );


  box.innerHTML = `

    <div class="card">

      <div class="food-icon">

        ${icon}

      </div>


      <div class="recipe-title">

        ${escapeHTML(
          currentRecipe.name
        )}

      </div>


      <div class="recipe-category">

        ${icon}

        ${escapeHTML(
          currentRecipe.category ||
          "其他"
        )}

      </div>


      ${
        recipeLink

          ? `

            <a
              class="recipe-link-box"
              href="${escapeHTML(
                normalizeRecipeLink(
                  recipeLink
                )
              )}"
              target="_blank"
              rel="noopener noreferrer">

              🔗 打开食谱 Link

            </a>

          `

          : ""

      }


      <h3 class="recipe-section-title">

        🥕 材料

      </h3>


      <div id="ingredientEditor">

        ${
          ingredients.map(
            function(item, index) {

              return ingredientEditorHTML(
                item,
                index
              );

            }
          ).join("")
        }

      </div>


      <button
        class="add-row-button"
        onclick="addIngredientRow()">

        ➕ 添加材料

      </button>


      <h3 class="recipe-section-title">

        👩‍🍳 做法

      </h3>


      <div id="stepEditor">

        ${
          instructions.map(
            function(item, index) {

              return stepEditorHTML(
                item,
                index
              );

            }
          ).join("")
        }

      </div>


      <button
        class="add-row-button"
        onclick="addStepRow()">

        ➕ 添加步骤

      </button>


      <h3 class="recipe-section-title">

        🔗 食谱 Link

      </h3>


      <input
        id="recipeLink"
        class="recipe-link-input"
        type="url"
        value="${escapeHTML(recipeLink)}"
        placeholder="例如：https://www.youtube.com/...">


      <button
        class="save-recipe"
        onclick="saveRecipeDetail()">

        💾 保存食谱 ❤️

      </button>

    </div>

  `;

}


/* =====================================================
   材料格子
===================================================== */

function ingredientEditorHTML(
  item,
  index
) {

  const name =
    typeof item === "string"
      ? item
      : (
          item &&
          item.name
        ) || "";


  const amount =
    typeof item === "string"
      ? ""
      : (
          item &&
          item.amount
        ) || "";


  return `

    <div class="ingredient-row">

      <input
        class="ingredient-name"
        placeholder="材料，例如：鸡腿肉"
        value="${escapeHTML(name)}">


      <input
        class="ingredient-amount"
        placeholder="分量，例如：2块"
        value="${escapeHTML(amount)}">


      <button
        type="button"
        class="small-delete"
        onclick="this.parentElement.remove()">

        🗑️

      </button>

    </div>

  `;

}


/* =====================================================
   ➕ 添加材料
===================================================== */

function addIngredientRow() {

  const box =
    document.getElementById(
      "ingredientEditor"
    );


  if (!box) {
    return;
  }


  const div =
    document.createElement(
      "div"
    );


  div.innerHTML =
    ingredientEditorHTML(
      {
        name: "",
        amount: ""
      },
      box.children.length
    );


  box.appendChild(
    div.firstElementChild
  );

}


/* =====================================================
   做法格子
===================================================== */

function stepEditorHTML(
  item,
  index
) {

  return `

    <div class="step-row">

      <div class="step-number">

        ${index + 1}

      </div>


      <textarea
        class="step-text"
        placeholder="请输入这个步骤……">${escapeHTML(item || "")}</textarea>


      <button
        type="button"
        class="small-delete"
        onclick="removeStep(this)">

        🗑️

      </button>

    </div>

  `;

}


/* =====================================================
   ➕ 添加步骤
===================================================== */

function addStepRow() {

  const box =
    document.getElementById(
      "stepEditor"
    );


  if (!box) {
    return;
  }


  const index =
    box.children.length;


  const div =
    document.createElement(
      "div"
    );


  div.innerHTML =
    stepEditorHTML(
      "",
      index
    );


  box.appendChild(
    div.firstElementChild
  );


  refreshStepNumbers();

}


/* =====================================================
   删除步骤
===================================================== */

function removeStep(
  button
) {

  if (
    !button ||
    !button.parentElement
  ) {
    return;
  }


  button.parentElement.remove();

  refreshStepNumbers();

}


/* =====================================================
   自动编号
===================================================== */

function refreshStepNumbers() {

  const rows =
    document.querySelectorAll(
      "#stepEditor .step-row"
    );


  rows.forEach(
    function(row, index) {

      const number =
        row.querySelector(
          ".step-number"
        );


      if (number) {

        number.textContent =
          index + 1;

      }

    }
  );

}


/* =====================================================
   💾 保存食谱
===================================================== */

async function saveRecipeDetail() {

  if (!currentRecipe) {
    return;
  }


  const ingredients = [];


  document
    .querySelectorAll(
      "#ingredientEditor .ingredient-row"
    )
    .forEach(
      function(row) {

        const nameInput =
          row.querySelector(
            ".ingredient-name"
          );


        const amountInput =
          row.querySelector(
            ".ingredient-amount"
          );


        const name =
          nameInput
            ? nameInput.value.trim()
            : "";


        const amount =
          amountInput
            ? amountInput.value.trim()
            : "";


        if (name || amount) {

          ingredients.push({

            name:
              name,

            amount:
              amount

          });

        }

      }
    );


  const instructions = [];


  document
    .querySelectorAll(
      "#stepEditor .step-row"
    )
    .forEach(
      function(row) {

        const textarea =
          row.querySelector(
            ".step-text"
          );


        const text =
          textarea
            ? textarea.value.trim()
            : "";


        if (text) {

          instructions.push(
            text
          );

        }

      }
    );


  const recipeLinkInput =
    document.getElementById(
      "recipeLink"
    );


  const recipeLink =
    recipeLinkInput
      ? recipeLinkInput.value.trim()
      : "";


  try {

    const response =
      await supabaseFetch(

        "/family_recipes?id=eq." +
        encodeURIComponent(
          currentRecipe.id
        ),

        {
          method: "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body: JSON.stringify({

            ingredients:
              JSON.stringify(
                ingredients
              ),

            instructions:
              JSON.stringify(
                instructions
              ),

            recipe_link:
              recipeLink ||
              null

          })

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      alert(
        "食谱保存失败 😢\n\n" +
        text
      );

      return;

    }


    alert(
      "食谱保存成功 ❤️"
    );


    const oldId =
      currentRecipe.id;


    await loadRecipes();


    const updatedRecipe =
      recipes.find(
        function(item) {

          return String(item.id) ===
            String(oldId);

        }
      );


    if (updatedRecipe) {

      currentRecipe =
        updatedRecipe;

    }


    renderRecipeDetail();

  }

  catch (error) {

    alert(
      "无法连接数据库 😢\n\n" +
      error.message
    );

  }

}


/* =====================================================
   ← 返回食谱
===================================================== */

function backToCookbook() {

  document
    .getElementById(
      "recipeDetail"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "cookbook"
    )
    .classList.remove(
      "hidden"
    );


  currentRecipe =
    null;

}


/* =====================================================
   页面切换
===================================================== */

function showPage(
  page,
  button
) {

  const pages = [

    "recipes",
    "add",
    "today",
    "cookbook",
    "recipeDetail"

  ];


  pages.forEach(
    function(pageName) {

      const section =
        document.getElementById(
          pageName
        );


      if (section) {

        section.classList.add(
          "hidden"
        );

      }

    }
  );


  const target =
    document.getElementById(
      page
    );


  if (target) {

    target.classList.remove(
      "hidden"
    );

  }


  document
    .querySelectorAll(
      "nav button"
    )
    .forEach(
      function(btn) {

        btn.classList.remove(
          "active"
        );

      }
    );


  if (button) {

    button.classList.add(
      "active"
    );

  }


  if (page === "recipes") {

    loadRecipes();

  }


  if (page === "add") {

    renderCategoryOptions();

  }


  if (page === "today") {

    loadTodayOrders();

  }


  if (page === "cookbook") {

    loadRecipes();

  }

}


/* =====================================================
   ⭐ 启动
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    renderCategoryOptions();

    loadRecipes();

    loadTodayOrders();

  }
);

</script>

<script>

/* =====================================================
   ⭐ SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://vgkjqpzktytadjavgzzn.supabase.co/rest/v1";

const SUPABASE_KEY =
  "sb_publishable_4ULyasIw_XqkjnLYbs90LA_MVrn1Ami";


let recipes = [];

let selectedCategory = "";

let currentRecipe = null;


/* =====================================================
   分类
===================================================== */

const categories = [

  { name: "鸡肉", icon: "🐔" },
  { name: "猪肉", icon: "🐷" },
  { name: "牛肉", icon: "🐮" },
  { name: "鸡蛋", icon: "🥚" },
  { name: "鱼", icon: "🐟" },
  { name: "海鲜", icon: "🦐" },
  { name: "蔬菜", icon: "🥬" },
  { name: "饭", icon: "🍚" },
  { name: "面食", icon: "🍜" },
  { name: "意大利面", icon: "🍝" },
  { name: "汤", icon: "🍲" },
  { name: "点心", icon: "🥟" },
  { name: "甜点", icon: "🍰" },
  { name: "早餐", icon: "🍳" },
  { name: "其他", icon: "🍽️" }

];


/* =====================================================
   Supabase URL
===================================================== */

function supabaseBaseURL() {

  return String(SUPABASE_URL)
    .trim()
    .replace(/\/+$/, "");

}


/* =====================================================
   Supabase Key
===================================================== */

function supabaseKey() {

  return String(SUPABASE_KEY).trim();

}


/* =====================================================
   分类图案
===================================================== */

function getCategoryIcon(category) {

  const found =
    categories.find(function(item) {

      return item.name === category;

    });

  return found
    ? found.icon
    : "🍽️";

}


/* =====================================================
   分类按钮
===================================================== */

function renderCategoryOptions() {

  const box =
    document.getElementById(
      "categoryGrid"
    );

  box.innerHTML =

    categories.map(function(category) {

      const selected =
        selectedCategory === category.name
          ? "selected"
          : "";

      return `

        <button
          type="button"
          class="category-option ${selected}"
          onclick="selectCategory('${category.name}')">

          <span class="category-icon">
            ${category.icon}
          </span>

          ${category.name}

        </button>

      `;

    }).join("");

}


/* =====================================================
   选择分类
===================================================== */

function selectCategory(category) {

  selectedCategory = category;

  renderCategoryOptions();

}


/* =====================================================
   🍽️ 读取食物
===================================================== */

async function loadRecipes() {

  const box =
    document.getElementById(
      "recipeList"
    );

  box.innerHTML =
    '<div class="loading">正在读取食物……</div>';

  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes?select=*&order=created_at.desc";

    const response =
      await fetch(url, {

        method: "GET",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey()

        }

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Recipe error:",
        response.status,
        errorText
      );

      box.innerHTML =
        '<div class="empty">食物读取失败 😢</div>';

      return;

    }

    recipes =
      await response.json();

    renderRecipes();

    renderCookbook();

  }

  catch (error) {

    console.error(
      "Recipe connection error:",
      error
    );

    box.innerHTML =
      '<div class="empty">食物读取失败 😢</div>';

  }

}


/* =====================================================
   🍽️ 显示食物
===================================================== */

function renderRecipes() {

  const box =
    document.getElementById(
      "recipeList"
    );

  if (!recipes.length) {

    box.innerHTML =
      '<div class="empty">还没有食物 😊<br>点击「➕ 添加食物」开始吧！</div>';

    return;

  }

  box.innerHTML =

    recipes.map(function(recipe) {

      return recipeCardHTML(recipe);

    }).join("");

}


/* =====================================================
   🍽️ 食物卡片
===================================================== */

function recipeCardHTML(recipe) {

  const icon =
    getCategoryIcon(
      recipe.category
    );

  return `

    <div class="card">

      <div class="food-icon">
        ${icon}
      </div>

      <h2 class="food-name">
        ${escapeHTML(recipe.name)}
      </h2>

      <span class="tag">
        ${icon}
        ${escapeHTML(recipe.category || "其他")}
      </span>

      <div class="action-row">

        <button
          class="action me"
          onclick="orderRecipe('${recipe.id}', '我')">

          ❤️ 我点

        </button>

        <button
          class="action husband"
          onclick="orderRecipe('${recipe.id}', '老公')">

          ❤️ 老公点

        </button>

      </div>

      <br>

      <button
        class="delete"
        onclick="deleteRecipe('${recipe.id}')">

        🗑️ 删除食物

      </button>

    </div>

  `;

}


/* =====================================================
   🔍 搜索食物
===================================================== */

function searchFood() {

  const input =
    document.getElementById(
      "foodSearch"
    );

  const keyword =
    input.value
      .trim()
      .toLowerCase();

  if (!keyword) {

    renderRecipes();

    return;

  }

  const filteredRecipes =
    recipes.filter(function(recipe) {

      const name =
        String(recipe.name || "")
          .toLowerCase();

      const category =
        String(recipe.category || "")
          .toLowerCase();

      return (
        name.includes(keyword) ||
        category.includes(keyword)
      );

    });

  const box =
    document.getElementById(
      "recipeList"
    );

  if (!filteredRecipes.length) {

    box.innerHTML = `

      <div class="empty">

        😢 找不到「${escapeHTML(keyword)}」

        <br><br>

        试试看其他食物名字或分类

      </div>

    `;

    return;

  }

  box.innerHTML = `

    <div class="search-result-count">

      找到 ${filteredRecipes.length} 道食物 ❤️

    </div>

    ${

      filteredRecipes.map(function(recipe) {

        return recipeCardHTML(recipe);

      }).join("")

    }

  `;

}


/* =====================================================
   ➕ 添加食物
===================================================== */

async function addRecipe() {

  const name =
    document
      .getElementById("recipeName")
      .value
      .trim();

  if (!name) {

    alert("请先填写食物名字 ❤️");

    return;

  }

  if (!selectedCategory) {

    alert("请选择一个分类 ❤️");

    return;

  }

  const saveButton =
    document.getElementById(
      "saveButton"
    );

  saveButton.disabled = true;

  saveButton.textContent =
    "正在保存……";

  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes";

    const response =
      await fetch(url, {

        method: "POST",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey(),

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body: JSON.stringify({

          name: name,

          category: selectedCategory,

          ingredients: JSON.stringify([]),

          instructions: JSON.stringify([]),

          recipe_link: null

        })

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Save error:",
        response.status,
        errorText
      );

      alert(
        "保存失败 😢\n" +
        errorText
      );

      return;

    }

    alert(
      "食物保存成功 ❤️"
    );

    document
      .getElementById("recipeName")
      .value = "";

    selectedCategory = "";

    renderCategoryOptions();

    await loadRecipes();

    showPage(
      "recipes",
      document.querySelector("nav button")
    );

  }

  catch (error) {

    console.error(
      "Save connection error:",
      error
    );

    alert(
      "无法连接数据库 😢"
    );

  }

  finally {

    saveButton.disabled = false;

    saveButton.textContent =
      "保存食物 ❤️";

  }

}


/* =====================================================
   🗑️ 删除食物
===================================================== */

async function deleteRecipe(id) {

  const password =
    prompt("请输入删除密码：");

  if (password === null) {
    return;
  }

  if (password !== "1") {

    alert("密码错误 ❌");

    return;

  }

  const recipe =
    recipes.find(function(item) {

      return String(item.id) ===
        String(id);

    });

  const confirmDelete =
    confirm(
      "确定要删除「" +
      (recipe
        ? recipe.name
        : "这个食物") +
      "」吗？\n\n删除后食物和保存的食谱资料都会删除。"
    );

  if (!confirmDelete) {
    return;
  }

  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes?id=eq." +
      encodeURIComponent(id);

    const response =
      await fetch(url, {

        method: "DELETE",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey(),

          "Prefer":
            "return=representation"

        }

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Delete error:",
        response.status,
        errorText
      );

      alert(
        "删除失败 😢\n" +
        errorText
      );

      return;

    }

    alert(
      "食物已经删除 ❤️"
    );

    currentRecipe = null;

    await loadRecipes();

  }

  catch (error) {

    console.error(
      "Delete error:",
      error
    );

    alert("删除失败 😢");

  }

}


/* =====================================================
   ❤️ 点菜
===================================================== */

async function orderRecipe(id, person) {

  const recipe =
    recipes.find(function(item) {

      return String(item.id) ===
        String(id);

    });

  if (!recipe) {
    return;
  }

  const confirmOrder =
    confirm(

      "确定要点：\n\n" +

      recipe.name +

      "\n\n点菜人：" +

      person

    );

  if (!confirmOrder) {
    return;
  }

  try {

    const url =
      supabaseBaseURL() +
      "/family_orders";

    const response =
      await fetch(url, {

        method: "POST",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey(),

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body: JSON.stringify({

          recipe_name:
            recipe.name,

          ordered_by:
            person

        })

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Order error:",
        response.status,
        errorText
      );

      alert(
        "加入今日菜单失败 😢\n" +
        errorText
      );

      return;

    }

    alert(
      recipe.name +
      "\n已经加入今日菜单 ❤️"
    );

    await loadTodayOrders();

  }

  catch (error) {

    console.error(
      "Order connection error:",
      error
    );

    alert(
      "无法连接今日菜单 😢"
    );

  }

}


/* =====================================================
   📋 今日菜单
===================================================== */

async function loadTodayOrders() {

  const box =
    document.getElementById(
      "todayList"
    );

  box.innerHTML =
    '<div class="loading">正在读取今日菜单……</div>';

  try {

    const url =
      supabaseBaseURL() +
      "/family_orders?select=*&order=created_at.desc";

    const response =
      await fetch(url, {

        method: "GET",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey()

        }

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Today orders error:",
        response.status,
        errorText
      );

      box.innerHTML =
        '<div class="empty">今日菜单读取失败 😢</div>';

      return;

    }

    const allOrders =
      await response.json();

    const today =
      new Date();

    const orders =
      allOrders.filter(function(order) {

        if (!order.created_at) {
          return false;
        }

        const orderDate =
          new Date(
            order.created_at
          );

        return (

          orderDate.getFullYear() ===
          today.getFullYear()

          &&

          orderDate.getMonth() ===
          today.getMonth()

          &&

          orderDate.getDate() ===
          today.getDate()

        );

      });

    renderToday(orders);

  }

  catch (error) {

    console.error(
      "Today orders error:",
      error
    );

    box.innerHTML =
      '<div class="empty">今日菜单读取失败 😢</div>';

  }

}


/* =====================================================

function renderToday(orders) {

  const box =

            "zh-CN",

              minute: "2-digit"
            }
          )

        : "";

      return `

        <div class="card">

          <div class="food-icon">
            ${icon}
          </div>

          <h2 class="food-name">

/* =====================================================
   📖 打开食谱
===================================================== */

function openRecipe(id) {

  const recipe =
    recipes.find(function(item) {

      return String(item.id) ===
        String(id);

    });

  if (!recipe) {
    return;
  }

  currentRecipe = recipe;

  document
    .getElementById("cookbook")
    .classList.add("hidden");

  document
    .getElementById("recipeDetail")
    .classList.remove("hidden");

  renderRecipeDetail();

}


/* =====================================================
   📖 读取材料
===================================================== */

function parseIngredients(recipe) {

  try {

    if (!recipe.ingredients) {
      return [];
    }

    if (Array.isArray(recipe.ingredients)) {
      return recipe.ingredients;
    }

    const data =
      JSON.parse(recipe.ingredients);

    if (Array.isArray(data)) {
      return data;
    }

    return [];

  }

  catch (error) {

    console.error(
      "Ingredients parse error:",
      error
    );

    return [];

  }

}


/* =====================================================
   👩‍🍳 读取做法
===================================================== */

function parseInstructions(recipe) {

  try {

    if (!recipe.instructions) {
      return [];
    }

    if (Array.isArray(recipe.instructions)) {
      return recipe.instructions;
    }

    const data =
      JSON.parse(recipe.instructions);

    if (Array.isArray(data)) {
      return data;
    }

    return [];

  }

  catch (error) {

    console.error(
      "Instructions parse error:",
      error
    );

    return [];

  }

}


/* =====================================================
   🔗 清理 Link
===================================================== */

function normalizeRecipeLink(link) {

  const value =
    String(link || "").trim();

  if (!value) {
    return "";
  }

  if (
    value.startsWith("https://") ||
    value.startsWith("http://")
  ) {

    return value;

  }

  return "https://" + value;

}


/* =====================================================
   📖 显示食谱
===================================================== */

function renderRecipeDetail() {

  if (!currentRecipe) {

    );

/* =====================================================
   材料格子
===================================================== */

function ingredientEditorHTML(item, index) {

  const name =
    typeof item === "string"
      ? item
      : (item.name || "");

  const amount =
    typeof item === "string"
      ? ""
      : (item.amount || "");

  return `

    <div class="ingredient-row">

      <input
        class="ingredient-name"
        placeholder="材料，例如：鸡腿肉"
        value="${escapeHTML(name)}">

      <input
        class="ingredient-amount"
        placeholder="分量，例如：2块"
        value="${escapeHTML(amount)}">

      <button
        type="button"
        class="small-delete"
        onclick="this.parentElement.remove()">

        🗑️

      </button>

    </div>

  `;

}


/* =====================================================
   ➕ 增加材料
===================================================== */

function addIngredientRow() {

  const box =
    document.getElementById(
      "ingredientEditor"
    );

  const div =
    document.createElement("div");

  div.innerHTML =
    ingredientEditorHTML(

      box.children.length
    );

  );

}


/* =====================================================
   做法格子
===================================================== */

function stepEditorHTML(item, index) {

  return `

    <div class="step-row">

      <div class="step-number">
        ${index + 1}
      </div>

      <textarea
        class="step-text"
        placeholder="请输入这个步骤……">${escapeHTML(item || "")}</textarea>

      <button

}


/* =====================================================
   ➕ 增加做法
===================================================== */

function addStepRow() {

  const box =
    document.getElementById(
      "stepEditor"
    );

  const index =
    box.children.length;

  const div =
    document.createElement("div");

  div.innerHTML =
    stepEditorHTML(
      "",
      index
    );

  box.appendChild(
    div.firstElementChild
  );

  refreshStepNumbers();

}


/* =====================================================
   删除做法
===================================================== */

function removeStep(button) {

  button.parentElement.remove();

  refreshStepNumbers();

}


/* =====================================================
   自动更新步骤编号
===================================================== */

function refreshStepNumbers() {

  const rows =
    document.querySelectorAll(
      "#stepEditor .step-row"
    );

  rows.forEach(function(row, index) {

    const number =
      row.querySelector(
        ".step-number"
      );

    number.textContent =
      index + 1;

  });

}


/* =====================================================
   💾 保存食谱
===================================================== */

async function saveRecipeDetail() {

  if (!currentRecipe) {
    return;
  }

  const ingredientRows =
    document.querySelectorAll(
      "#ingredientEditor .ingredient-row"
    );

  const ingredients = [];

  ingredientRows.forEach(function(row) {

    const name =
      row.querySelector(
        ".ingredient-name"
      ).value.trim();

    const amount =
      row.querySelector(
        ".ingredient-amount"
      ).value.trim();

    if (name || amount) {

      ingredients.push({

        name: name,

        amount: amount

      });

    }

  });


  const stepRows =
    document.querySelectorAll(
      "#stepEditor .step-row"
    );

  const instructions = [];

  stepRows.forEach(function(row) {

    const text =
      row.querySelector(
        ".step-text"
      ).value.trim();

    if (text) {

      instructions.push(text);

    }

  });


  const recipeLinkInput =
    document.getElementById(
      "recipeLink"
    );

  const recipeLink =
    recipeLinkInput
      ? recipeLinkInput.value.trim()
      : "";


  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes?id=eq." +
      encodeURIComponent(
        currentRecipe.id
      );

    const response =
      await fetch(url, {

        method: "PATCH",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey(),

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body: JSON.stringify({

          ingredients:
            JSON.stringify(
              ingredients
            ),

          instructions:
            JSON.stringify(
              instructions
            ),

          recipe_link:
            recipeLink || null

        })

      });


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Save recipe detail error:",
        response.status,
        errorText
      );

      alert(
        "食谱保存失败 😢\n" +
        errorText
      );

      return;

    }


    alert(
      "食谱保存成功 ❤️"
    );


    const updated =
      await response.json();

    if (
      Array.isArray(updated) &&
      updated.length
    ) {

      currentRecipe =
        updated[0];

    }


    await loadRecipes();

    currentRecipe =
      recipes.find(function(item) {

        return String(item.id) ===
          String(currentRecipe.id);

      }) || currentRecipe;

    renderRecipeDetail();

  }

  catch (error) {

    console.error(
      "Save recipe detail connection error:",
      error
    );

    alert(
      "无法连接数据库 😢"
    );

  }

}

function getIconFromFoodName(name) {

      return item.name === name;

    });

  if (recipe) {

    return getCategoryIcon(
      recipe.category
    );

  }

  return "🍽️";

}


/* =====================================================
   取消今日菜单
===================================================== */

async function removeOrder(id) {

  const confirmRemove =
    confirm(
      "确定取消这道菜吗？"
    );

  if (!confirmRemove) {
    return;
  }

  try {

    const url =
      supabaseBaseURL() +
      "/family_orders?id=eq." +
      encodeURIComponent(id);

    const response =
      await fetch(url, {

        method: "DELETE",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey()

        }

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      alert(
        "取消失败 😢\n" +
        errorText
      );

      return;

    }

    await loadTodayOrders();

  }

  catch (error) {

    console.error(
      "Remove order error:",
      error
    );

    alert(
      "无法连接数据库 😢"
    );

  }

}


/* =====================================================
   页面切换
===================================================== */

function showPage(page, button) {

  const pages = [

    "recipes",
    "add",
    "today",
    "cookbook",
    "recipeDetail"

  ];


  pages.forEach(function(pageName) {

    const section =
      document.getElementById(
        pageName
      );

    if (section) {

      section.classList.add(
        "hidden"
      );

    }

  });


  document
    .getElementById(page)
    .classList.remove(
      "hidden"
    );


  document
    .querySelectorAll("nav button")
    .forEach(function(btn) {

      btn.classList.remove(
        "active"
      );

    });


  if (button) {

    button.classList.add(
      "active"
    );

  }


  if (page === "recipes") {

    loadRecipes();

  }


  if (page === "add") {

    renderCategoryOptions();

  }


  if (page === "today") {

    loadTodayOrders();

  }


  if (page === "cookbook") {

    loadRecipes();

  }

}


/* =====================================================
   安全显示
===================================================== */

function escapeHTML(text) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   启动
===================================================== */

renderCategoryOptions();

loadRecipes();

loadTodayOrders();

</script>

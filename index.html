<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>刘太厨房</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8f2;
  color: #3d2b24;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    sans-serif;
}

header {
  background: #f4c4a4;
  text-align: center;
  padding: 28px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 15px;
  background: white;
  overflow-x: auto;
}

nav button {
  border: 0;
  border-radius: 20px;
  padding: 10px 15px;
  background: #fff0e5;
  color: #8a573d;
  white-space: nowrap;
  cursor: pointer;
  font-size: 15px;
}

nav button.active {
  background: #e69765;
  color: white;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.food-icon {
  font-size: 52px;
  text-align: center;
  margin-bottom: 5px;
}

.food-name {
  text-align: center;
  margin: 5px 0 10px;
  font-size: 23px;
}

.tag {
  display: block;
  width: fit-content;
  margin: 0 auto 15px;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 13px;
}

.action-row {
  display: flex;
  gap: 8px;
}

button.action {
  flex: 1;
  border: 0;
  background: #e69765;
  color: white;
  padding: 12px 10px;
  border-radius: 14px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

button.action.husband {
  background: #d58b68;
}

button.delete {
  border: 0;
  background: #eee;
  padding: 11px 13px;
  border-radius: 12px;
  cursor: pointer;
  color: #8a4d3b;
  width: 100%;
  font-size: 14px;
}

button.recipe-button {
  width: 100%;
  border: 0;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 12px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 10px;
}

button.save-recipe {
  width: 100%;
  border: 0;
  background: #e69765;
  color: white;
  padding: 13px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
}

button.back-button {
  border: 0;
  background: #fff0e5;
  color: #8a573d;
  padding: 10px 15px;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 15px;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  margin: 7px 0 12px;
  border: 1px solid #ead8cc;
  border-radius: 12px;
  font-size: 16px;
  background: white;
  font-family: inherit;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.hidden {
  display: none !important;
}

.empty,
.loading {
  text-align: center;
  padding: 35px;
  color: #987d70;
}

.today-person {
  text-align: center;
  font-size: 16px;
  margin: 8px 0;
}

.today-time {
  text-align: center;
  font-size: 13px;
  color: #987d70;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 5px;
  margin-bottom: 15px;
}

.category-option {
  border: 1px solid #ead8cc;
  background: #fffaf7;
  border-radius: 14px;
  padding: 10px 5px;
  text-align: center;
  cursor: pointer;
  font-size: 13px;
}

.category-option.selected {
  background: #fff0e5;
  border: 2px solid #e69765;
}

.category-icon {
  display: block;
  font-size: 28px;
  margin-bottom: 3px;
}

.search-box {
  width: 100%;
  padding: 14px 16px;
  margin: 5px 0 15px;
  border: 1px solid #ead8cc;
  border-radius: 15px;
  font-size: 16px;
  background: white;
  outline: none;
}

.search-box:focus {
  border-color: #e69765;
  box-shadow: 0 0 0 3px rgba(230,151,101,.12);
}

.search-result-count {
  text-align: center;
  color: #987d70;
  font-size: 13px;
  margin: 0 0 15px;
}

.recipe-list-card {
  cursor: pointer;
}

.recipe-title {
  text-align: center;
  font-size: 26px;
  margin: 5px 0 8px;
  font-weight: bold;
}

.recipe-category {
  text-align: center;
  color: #987d70;
  margin-bottom: 20px;
}

.recipe-section-title {
  font-size: 20px;
  margin: 20px 0 12px;
}

.ingredient-row {
  display: flex;
  gap: 8px;
  margin-bottom: 9px;
  align-items: center;
}

.ingredient-row input:first-child {
  flex: 1.3;
}

.ingredient-row input:nth-child(2) {
  flex: 1;
}

.step-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 9px;
}

.step-number {
  width: 32px;
  min-width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #fff0e5;
  color: #9a5e3d;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.step-row textarea {
  margin: 0;
  min-height: 48px;
  flex: 1;
}

.small-delete {
  width: 38px;
  min-width: 38px;
  height: 38px;
  border: 0;
  border-radius: 10px;
  background: #f1eeee;
  cursor: pointer;
  font-size: 16px;
}

.add-row-button {
  width: 100%;
  border: 1px dashed #d8ad96;
  background: #fffaf7;
  color: #9a5e3d;
  padding: 11px;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 15px;
  font-size: 14px;
}

.recipe-link-box {
  display: block;
  width: 100%;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 13px;
  border-radius: 14px;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  margin-bottom: 15px;
}

.recipe-link-input {
  margin-bottom: 15px;
}

.recipe-actions {
  display: flex;
  gap: 8px;
}

.recipe-actions button {
  flex: 1;
}

button.recipe-delete {
  border: 0;
  background: #eee;
  color: #8a4d3b;
  padding: 13px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}

.notice {
  background: #fff0e5;
  color: #8a573d;
  padding: 13px;
  border-radius: 14px;
  margin-bottom: 15px;
  font-size: 14px;
}

.form-label {
  display: block;
  font-weight: bold;
  margin-top: 8px;
  margin-bottom: 3px;
}

.add-recipe-title {
  font-size: 20px;
  margin-top: 5px;
  margin-bottom: 15px;
}

@media (max-width: 420px) {

  .food-icon {
    font-size: 48px;
  }

  .ingredient-row {
    gap: 5px;
  }

  .ingredient-row input {
    min-width: 0;
  }

}

</style>

</head>

<body>

<header>

  <h1>🍳 刘太厨房</h1>

  <p>一家人的点菜 ❤️</p>

</header>


<nav>

  <button
    class="active"
    onclick="showPage('foods', this)">
    🍽️ 食物
  </button>

  <button
    onclick="showPage('addFood', this)">
    ➕ 添加食物
  </button>

  <button
    onclick="showPage('today', this)">
    📋 今日菜单
  </button>

  <button
    onclick="showPage('cookbook', this)">
    📖 食谱
  </button>

  <!-- ⭐ 新增：添加食谱 -->

  <button
    onclick="showPage('addRecipe', this)">
    ➕ 添加食谱
  </button>

</nav>


<main>


<!-- =====================================================
     🍽️ 食物
===================================================== -->

<section id="foods">

  <h2>🍽️ 刘太食物</h2>

  <input
    id="foodSearch"
    class="search-box"
    type="search"
    placeholder="🔍 搜索食物，例如：鸡、汤、意大利面"
    oninput="searchFoods()">

  <div id="foodList">

    <div class="loading">
      正在读取食物……
    </div>

  </div>

</section>


<!-- =====================================================
     ➕ 添加食物
===================================================== -->

<section id="addFood" class="hidden">

  <h2>➕ 添加食物</h2>

  <div class="card">

    <label>食物名字</label>

    <input
      id="foodName"
      placeholder="例如：黑椒鸡扒">

    <label>选择分类</label>

    <div
      id="categoryGrid"
      class="category-grid">
    </div>

    <button
      class="save-recipe"
      id="saveFoodButton"
      onclick="addFood()">

      保存食物 ❤️

    </button>

  </div>

</section>


<!-- =====================================================
     📋 今日菜单
===================================================== -->

<section id="today" class="hidden">

  <h2>📋 今日菜单</h2>

  <div id="todayList">

    <div class="loading">
      正在读取今日菜单……
    </div>

  </div>

</section>


<!-- =====================================================
     📖 食谱
===================================================== -->

<section id="cookbook" class="hidden">

  <h2>📖 刘太食谱</h2>

  <input
    id="recipeSearch"
    class="search-box"
    type="search"
    placeholder="🔍 搜索食谱，例如：鸡扒、汤、蛋糕"
    oninput="searchRecipes()">

  <div id="cookbookList">

    <div class="loading">
      正在读取食谱……
    </div>

  </div>

</section>


<!-- =====================================================
     ➕ 添加食谱
===================================================== -->

<section id="addRecipe" class="hidden">

  <h2>➕ 添加食谱</h2>

  <div class="card">

    <div class="notice">

      📖 新增的食谱会独立保存在「刘太食谱」里。<br>
      🍽️ 不会影响「食物」列表。

    </div>


    <label class="form-label">
      食谱名字
    </label>

    <input
      id="newRecipeName"
      placeholder="例如：北海道味噌黄油三文鱼">


    <label class="form-label">
      选择分类
    </label>

    <div
      id="recipeCategoryGrid"
      class="category-grid">
    </div>


    <h3 class="recipe-section-title">
      🥕 材料
    </h3>

    <div id="newIngredientEditor">

      <div class="ingredient-row">

        <input
          class="ingredient-name"
          placeholder="材料，例如：三文鱼">

        <input
          class="ingredient-amount"
          placeholder="分量，例如：2片">

        <button
          type="button"
          class="small-delete"
          onclick="this.parentElement.remove()">

          🗑️

        </button>

      </div>

    </div>


    <button
      type="button"
      class="add-row-button"
      onclick="addNewIngredientRow()">

      ➕ 添加材料

    </button>


    <h3 class="recipe-section-title">
      👩‍🍳 做法
    </h3>

    <div id="newStepEditor">

      <div class="step-row">

        <div class="step-number">
          1
        </div>

        <textarea
          class="step-text"
          placeholder="请输入第一个步骤……"></textarea>

        <button
          type="button"
          class="small-delete"
          onclick="removeNewStep(this)">

          🗑️

        </button>

      </div>

    </div>


    <button
      type="button"
      class="add-row-button"
      onclick="addNewStepRow()">

      ➕ 添加步骤

    </button>


    <h3 class="recipe-section-title">
      🔗 食谱 Link
    </h3>

    <input
      id="newRecipeLink"
      class="recipe-link-input"
      type="url"
      placeholder="例如：https://www.youtube.com/...">


    <button
      class="save-recipe"
      id="saveNewRecipeButton"
      onclick="addRecipe()">

      💾 保存新食谱 ❤️

    </button>

  </div>

</section>


<!-- =====================================================
     📖 食谱详情
===================================================== -->

<section id="recipeDetail" class="hidden">

  <button
    class="back-button"
    onclick="backToCookbook()">

    ← 返回食谱

  </button>

  <div id="recipeDetailContent"></div>

</section>


</main>


<script>


/* =====================================================
   ⭐ SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://vgkjqpzktytadjavgzzn.supabase.co/rest/v1";

const SUPABASE_KEY =
  "sb_publishable_4ULyasIw_XqkjnLYbs90LA_MVrn1Ami";


let foods = [];

let recipes = [];

let selectedCategory = "";

let selectedRecipeCategory = "";

let currentRecipe = null;


/* =====================================================
   分类
===================================================== */

const categories = [

  { name: "鸡肉", icon: "🐔" },
  { name: "猪肉", icon: "🐷" },
  { name: "牛肉", icon: "🐮" },
  { name: "鸡蛋", icon: "🥚" },
  { name: "鱼", icon: "🐟" },
  { name: "海鲜", icon: "🦐" },
  { name: "蔬菜", icon: "🥬" },
  { name: "饭", icon: "🍚" },
  { name: "面食", icon: "🍜" },
  { name: "意大利面", icon: "🍝" },
  { name: "汤", icon: "🍲" },
  { name: "点心", icon: "🥟" },
  { name: "甜点", icon: "🍰" },
  { name: "早餐", icon: "🍳" },
  { name: "其他", icon: "🍽️" }

];


/* =====================================================
   Supabase
===================================================== */

function supabaseBaseURL() {

  return String(SUPABASE_URL)
    .trim()
    .replace(/\/+$/, "");

}


function supabaseKey() {

  return String(SUPABASE_KEY).trim();

}


async function supabaseFetch(endpoint, options) {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(function() {

      controller.abort();

    }, 15000);


  const finalOptions =
    options || {};


  try {

    return await fetch(

      supabaseBaseURL() + endpoint,

      {

        ...finalOptions,

        signal:
          controller.signal,

        headers: {

          "apikey":
            supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey(),

          ...(finalOptions.headers || {})

        }

      }

    );

  }

  catch (error) {

    if (
      error &&
      error.name === "AbortError"
    ) {

      throw new Error(
        "连接数据库超时，请检查 Supabase。"
      );

    }

    throw error;

  }

  finally {

    clearTimeout(timeout);

  }

}


/* =====================================================
   图案
===================================================== */

function getCategoryIcon(category) {

  const found =
    categories.find(function(item) {

      return item.name === category;

    });

  return found
    ? found.icon
    : "🍽️";

}


/* =====================================================
   🍽️ 食物分类
===================================================== */

function renderCategoryOptions() {

  const box =
    document.getElementById(
      "categoryGrid"
    );

  if (!box) return;


  box.innerHTML =

    categories.map(function(category) {

      const selected =
        selectedCategory === category.name
          ? "selected"
          : "";


      return `

        <button
          type="button"
          class="category-option ${selected}"
          onclick="selectCategory('${escapeHTML(category.name)}')">

          <span class="category-icon">
            ${category.icon}
          </span>

          ${escapeHTML(category.name)}

        </button>

      `;

    }).join("");

}


function selectCategory(category) {

  selectedCategory =
    category;

  renderCategoryOptions();

}


/* =====================================================
   📖 食谱分类
===================================================== */

function renderRecipeCategoryOptions() {

  const box =
    document.getElementById(
      "recipeCategoryGrid"
    );

  if (!box) return;


  box.innerHTML =

    categories.map(function(category) {

      const selected =
        selectedRecipeCategory === category.name
          ? "selected"
          : "";


      return `

        <button
          type="button"
          class="category-option ${selected}"
          onclick="selectRecipeCategory('${escapeHTML(category.name)}')">

          <span class="category-icon">
            ${category.icon}
          </span>

          ${escapeHTML(category.name)}

        </button>

      `;

    }).join("");

}


function selectRecipeCategory(category) {

  selectedRecipeCategory =
    category;

  renderRecipeCategoryOptions();

}


/* =====================================================
   🍽️ 读取独立食物
===================================================== */

async function loadFoods() {

  const box =
    document.getElementById(
      "foodList"
    );

  if (!box) return;


  box.innerHTML =
    '<div class="loading">正在读取食物……</div>';


  try {

    const response =
      await supabaseFetch(

        "/family_foods?select=*&order=created_at.desc",

        {
          method: "GET"
        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      console.error(
        "Foods error:",
        response.status,
        text
      );


      box.innerHTML = `

        <div class="empty">

          😢 食物读取失败

          <br><br>

          ${escapeHTML(text)}

          <br><br>

          <button
            class="action"
            onclick="loadFoods()">

            🔄 重新读取

          </button>

        </div>

      `;

      return;

    }


    const data =
      text
        ? JSON.parse(text)
        : [];


    foods =
      Array.isArray(data)
        ? data
        : [];


    renderFoods();

  }

  catch (error) {

    console.error(error);


    box.innerHTML = `

      <div class="empty">

        😢 无法读取食物

        <br><br>

        ${escapeHTML(
          error.message || ""
        )}

        <br><br>

        <button
          class="action"
          onclick="loadFoods()">

          🔄 再试一次

        </button>

      </div>

    `;

  }

}


/* =====================================================
   🍽️ 显示食物
===================================================== */

function renderFoods(list) {

  const box =
    document.getElementById(
      "foodList"
    );

  if (!box) return;


  const data =
    Array.isArray(list)
      ? list
      : foods;


  if (!data.length) {

    box.innerHTML =

      '<div class="empty">还没有食物 😊<br>点击「➕ 添加食物」开始吧！</div>';

    return;

  }


  box.innerHTML =

    data.map(function(food) {

      return foodCardHTML(food);

    }).join("");

}


/* =====================================================
   🍽️ 食物卡片
===================================================== */

function foodCardHTML(food) {

  const icon =
    getCategoryIcon(
      food.category
    );


  const id =
    escapeHTML(
      String(food.id)
    );


  return `

    <div class="card">

      <div class="food-icon">
        ${icon}
      </div>

      <h2 class="food-name">
        ${escapeHTML(
          food.name || "未命名食物"
        )}
      </h2>

      <span class="tag">

        ${icon}

        ${escapeHTML(
          food.category || "其他"
        )}

      </span>


      <div class="action-row">

        <button
          class="action"
          onclick="orderFood('${id}', '我')">

          ❤️ 我点

        </button>


        <button
          class="action husband"
          onclick="orderFood('${id}', '老公')">

          ❤️ 老公点

        </button>

      </div>


      <br>


      <button
        class="delete"
        onclick="deleteFood('${id}')">

        🗑️ 删除食物

      </button>

    </div>

  `;

}


/* =====================================================
   🔍 搜索食物
===================================================== */

function searchFoods() {

  const input =
    document.getElementById(
      "foodSearch"
    );

  if (!input) return;


  const keyword =
    input.value
      .trim()
      .toLowerCase();


  if (!keyword) {

    renderFoods();

    return;

  }


  const filtered =
    foods.filter(function(food) {

      const name =
        String(
          food.name || ""
        ).toLowerCase();


      const category =
        String(
          food.category || ""
        ).toLowerCase();


      return (

        name.includes(keyword) ||

        category.includes(keyword)

      );

    });


  const box =
    document.getElementById(
      "foodList"
    );


  if (!filtered.length) {

    box.innerHTML = `

      <div class="empty">

        😢 找不到「${escapeHTML(keyword)}」

        <br><br>

        试试看其他食物名字或分类

      </div>

    `;

    return;

  }


  box.innerHTML = `

    <div class="search-result-count">

      找到 ${filtered.length} 道食物 ❤️

    </div>

    ${filtered.map(function(food) {

      return foodCardHTML(food);

    }).join("")}

  `;

}


/* =====================================================
   ➕ 添加食物
===================================================== */

async function addFood() {

  const input =
    document.getElementById(
      "foodName"
    );


  const name =
    input.value.trim();


  if (!name) {

    alert(
      "请先填写食物名字 ❤️"
    );

    return;

  }


  if (!selectedCategory) {

    alert(
      "请选择一个分类 ❤️"
    );

    return;

  }


  const button =
    document.getElementById(
      "saveFoodButton"
    );


  button.disabled = true;

  button.textContent =
    "正在保存……";


  try {

    const response =
      await supabaseFetch(

        "/family_foods",

        {

          method: "POST",

          headers: {

===================================================== */

async function loadTodayOrders() {

  const box =
    document.getElementById(
      "todayList"
    );


  if (!box) return;


  box.innerHTML =
    '<div class="loading">正在读取今日菜单……</div>';


  try {

    const response =
      await supabaseFetch(

        "/family_orders?select=*&order=created_at.desc",

        {
          method: "GET"
        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      box.innerHTML = `

        <div class="empty">

          😢 今日菜单读取失败

          <br><br>

          ${escapeHTML(text)}

        </div>

      `;

      return;

    }


    const allOrders =
      text
        ? JSON.parse(text)
        : [];


    const today =
      new Date();


    const orders =
      allOrders.filter(
        function(order) {

          if (!order.created_at) {
            return false;
          }


          const date =
            new Date(
              order.created_at
            );


          return (

            date.getFullYear() ===
            today.getFullYear()

            &&

            date.getMonth() ===
            today.getMonth()

            &&

            date.getDate() ===
            today.getDate()

          );

        }
      );


    renderToday(orders);

  }

  catch (error) {

    box.innerHTML = `

      <div class="empty">

        😢 今日菜单读取失败

        <br><br>

        ${escapeHTML(
          error.message || ""
        )}

      </div>

    `;

  }

}

===================================================== */

function searchRecipes() {

  const input =
    document.getElementById(
      "recipeSearch"
    );


  if (!input) return;


  const keyword =
    input.value
      .trim()
      .toLowerCase();


  if (!keyword) {

    renderCookbook();

    return;

  }


  const filtered =
    recipes.filter(function(recipe) {

      const name =
        String(
          recipe.name || ""
        ).toLowerCase();


      const category =
        String(
          recipe.category || ""
        ).toLowerCase();


      const ingredients =
        String(
          recipe.ingredients || ""
        ).toLowerCase();


      const instructions =
        String(
          recipe.instructions || ""
        ).toLowerCase();


      return (

        name.includes(keyword) ||

        category.includes(keyword) ||

        ingredients.includes(keyword) ||

        instructions.includes(keyword)

      );

    });


  const box =
    document.getElementById(
      "cookbookList"
    );


  if (!filtered.length) {

    box.innerHTML = `

      <div class="empty">

        😢 找不到「${escapeHTML(keyword)}」

      </div>

    `;

    return;

  }


  box.innerHTML = `

    <div class="search-result-count">

      找到 ${filtered.length} 个食谱 ❤️

    </div>

    ${filtered.map(function(recipe) {

      return recipeCardHTML(recipe);

    }).join("")}

  `;

}

/* =====================================================
   📖 材料解析
===================================================== */

function parseIngredients(recipe) {

  try {

    if (!recipe.ingredients) {
      return [];
    }


    if (
      Array.isArray(
        recipe.ingredients
      )
    ) {

      return recipe.ingredients;

    }


    const data =
      JSON.parse(
        recipe.ingredients
      );


    return Array.isArray(data)
      ? data
      : [];

  }

  catch (error) {

    return [];

  }

}


/* =====================================================
   📖 做法解析
===================================================== */

function parseInstructions(recipe) {

  try {

    if (!recipe.instructions) {
      return [];
    }


    if (
      Array.isArray(
        recipe.instructions
      )
    ) {

      return recipe.instructions;

    }


    const data =
      JSON.parse(
        recipe.instructions
      );


    return Array.isArray(data)
      ? data
      : [];

  }

  catch (error) {

    return [];

  }

}


/* =====================================================
   🔗 Link
===================================================== */

function normalizeRecipeLink(link) {

  const value =
    String(link || "").trim();


  if (!value) {
    return "";
  }


  if (
    value.startsWith("https://") ||
    value.startsWith("http://")
  ) {

    return value;

  }


  return "https://" + value;

}

        ➕ 添加步骤

      </button>


      <h3 class="recipe-section-title">

        🔗 食谱 Link

      </h3>


      <input
        id="recipeLink"
        class="recipe-link-input"
        type="url"
        value="${escapeHTML(recipeLink)}"
        placeholder="例如：https://www.youtube.com/...">


      <button
        class="save-recipe"
        onclick="saveRecipeDetail()">

        💾 保存食谱 ❤️

      </button>

    </div>

  `;

}


/* =====================================================
   材料
===================================================== */

function ingredientEditorHTML(item) {

  const name =
    typeof item === "string"
      ? item
      : (item.name || "");


  const amount =
    typeof item === "string"
      ? ""
      : (item.amount || "");


  return `

    <div class="ingredient-row">

      <input
        class="ingredient-name"
        placeholder="材料，例如：鸡腿肉"
        value="${escapeHTML(name)}">


      <input
        class="ingredient-amount"
        placeholder="分量，例如：2块"
        value="${escapeHTML(amount)}">


      <button
        type="button"
        class="small-delete"
        onclick="this.parentElement.remove()">

        🗑️

      </button>

    </div>

  `;

}


/* =====================================================
   ➕ 材料
===================================================== */

function addIngredientRow() {

  const box =
    document.getElementById(
      "ingredientEditor"
    );


  if (!box) return;


  const div =
    document.createElement(
      "div"
    );


  div.innerHTML =
    ingredientEditorHTML({
      name: "",
      amount: ""
    });


  box.appendChild(
    div.firstElementChild
  );

}


/* =====================================================
   做法
===================================================== */

function stepEditorHTML(item, index) {

  return `

    <div class="step-row">

      <div class="step-number">

        ${index + 1}

      </div>


      <textarea
        class="step-text"
        placeholder="请输入这个步骤……">${escapeHTML(item || "")}</textarea>


      <button
        type="button"
        class="small-delete"
        onclick="removeStep(this)">

        🗑️

      </button>

    </div>

  `;

}


/* =====================================================
   ➕ 步骤
===================================================== */

function addStepRow() {

  const box =
    document.getElementById(
      "stepEditor"
    );


  if (!box) return;


  const index =
    box.children.length;


  const div =
    document.createElement(
      "div"
    );


  div.innerHTML =
    stepEditorHTML(
      "",
      index
    );


  box.appendChild(
    div.firstElementChild
  );


  refreshStepNumbers();

}


function removeStep(button) {

  if (!button) return;


  button.parentElement.remove();


  refreshStepNumbers();

}


function refreshStepNumbers() {

  const rows =
    document.querySelectorAll(
      "#stepEditor .step-row"
    );


  rows.forEach(
    function(row, index) {

      const number =
        row.querySelector(
          ".step-number"
        );


      if (number) {

        number.textContent =
          index + 1;

      }

    }
  );

}


/* =====================================================
   💾 保存食谱
===================================================== */

async function saveRecipeDetail() {

  if (!currentRecipe) {
    return;
  }


  const ingredientRows =
    document.querySelectorAll(
      "#ingredientEditor .ingredient-row"
    );


  const ingredients = [];


  ingredientRows.forEach(
    function(row) {

      const name =
        row.querySelector(
          ".ingredient-name"
        ).value.trim();


      const amount =
        row.querySelector(
          ".ingredient-amount"
        ).value.trim();


      if (name || amount) {

        ingredients.push({

          name: name,

          amount: amount

        });

      }

    }
  );


  const stepRows =
    document.querySelectorAll(
      "#stepEditor .step-row"
    );


  const instructions = [];


  stepRows.forEach(
    function(row) {

      const text =
        row.querySelector(
          ".step-text"
        ).value.trim();


      if (text) {

        instructions.push(text);

      }

    }
  );


  const recipeLinkInput =
    document.getElementById(
      "recipeLink"
    );


  const recipeLink =
    recipeLinkInput
      ? recipeLinkInput.value.trim()
      : "";


  try {

    const response =
      await supabaseFetch(

        "/family_recipes?id=eq." +
        encodeURIComponent(
          currentRecipe.id
        ),

        {

          method: "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body: JSON.stringify({

            ingredients:
              JSON.stringify(
                ingredients
              ),

            instructions:
              JSON.stringify(
                instructions
              ),

            recipe_link:
              recipeLink || null

          })

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      alert(
        "食谱保存失败 😢\n\n" +
        text
      );

      return;

    }


    alert(
      "食谱保存成功 ❤️"
    );


    await loadRecipes();


    const updated =
      recipes.find(
        function(item) {

          return String(item.id) ===
            String(currentRecipe.id);

        }
      );


    if (updated) {

      currentRecipe =
        updated;

    }


    renderRecipeDetail();

  }

  catch (error) {

    alert(
      "无法连接数据库 😢\n\n" +
      error.message
    );

  }

}


/* =====================================================
   返回
===================================================== */

function backToCookbook() {

  document
    .getElementById(
      "recipeDetail"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "cookbook"
    )
    .classList.remove(
      "hidden"
    );


  currentRecipe =
    null;

}


/* =====================================================
   找食物图案
===================================================== */

function getIconFromFoodName(name) {

  const food =
    foods.find(
      function(item) {

        return item.name === name;

      }
    );


  if (food) {

    return getCategoryIcon(
      food.category
    );

  }


  const recipe =
    recipes.find(
      function(item) {

        return item.name === name;

      }
    );


  if (recipe) {

    return getCategoryIcon(
      recipe.category
    );

  }


  return "🍽️";

}


/* =====================================================
   取消今日菜单
===================================================== */

async function removeOrder(id) {

  const confirmed =
    confirm(
      "确定取消这道菜吗？"
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await supabaseFetch(

        "/family_orders?id=eq." +
        encodeURIComponent(id),

        {

          method: "DELETE"

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      alert(
        "取消失败 😢\n\n" +
        text
      );

      return;

    }


    await loadTodayOrders();

  }

  catch (error) {

    alert(
      "无法连接数据库 😢\n\n" +
      error.message
    );

  }

}


/* =====================================================
   页面切换
===================================================== */

function showPage(page, button) {

  const pages = [

    "foods",
    "addFood",
    "today",
    "cookbook",
    "addRecipe",
    "recipeDetail"

  ];


  pages.forEach(
    function(pageName) {

      const section =
        document.getElementById(
          pageName
        );


      if (section) {

        section.classList.add(
          "hidden"
        );

      }

    }
  );


  const target =
    document.getElementById(
      page
    );


  if (target) {

    target.classList.remove(
      "hidden"
    );

  }


  document
    .querySelectorAll(
      "nav button"
    )
    .forEach(
      function(btn) {

        btn.classList.remove(
          "active"
        );

      }
    );


  if (button) {

    button.classList.add(
      "active"
    );

  }


  if (page === "foods") {

    loadFoods();

  }


  if (page === "addFood") {

    renderCategoryOptions();

  }


  if (page === "today") {

    loadTodayOrders();

  }


  if (page === "cookbook") {

    loadRecipes();

  }


  if (page === "addRecipe") {

    renderRecipeCategoryOptions();

  }

}


/* =====================================================
   安全显示
===================================================== */

function escapeHTML(text) {

  return String(
    text ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ⭐ 启动
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    renderCategoryOptions();

    renderRecipeCategoryOptions();

    loadFoods();

    loadRecipes();

    loadTodayOrders();

  }
);

</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刘太厨房</title>

<style>
body {
  margin: 0;
  background: #fff8f2;
  color: #3d2b24;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
}

header {
  background: #f4c4a4;
  text-align: center;
  padding: 30px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 15px;
  background: white;
  overflow-x: auto;
}

nav button {
  border: 0;
  border-radius: 20px;
  padding: 10px 15px;
  background: #fff0e5;
  color: #8a573d;
  white-space: nowrap;
  cursor: pointer;
}

nav button.active {
  background: #e69765;
  color: white;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.food {
  font-size: 42px;
}

.tag {
  display: inline-block;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 5px 9px;
  border-radius: 10px;
  font-size: 13px;
}

button.action {
  border: 0;
  background: #e69765;
  color: white;
  padding: 11px 17px;
  border-radius: 14px;
  font-weight: bold;
  cursor: pointer;
}

button.action:disabled {
  opacity: .6;
}

button.delete {
  border: 0;
  background: #eee;
  padding: 9px 13px;
  border-radius: 12px;
  cursor: pointer;
  color: #8a4d3b;
}

button.link-button {
  display: inline-block;
  border: 0;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 11px 15px;
  border-radius: 13px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 5px;
}

input,
textarea,
select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 7px 0 14px;
  border: 1px solid #ead8cc;
  border-radius: 12px;
  font-size: 16px;
}

.hidden {
  display: none;
}

.empty,
.loading {
  text-align: center;
  padding: 35px;
  color: #987d70;
}

.recipe-link-box {
  background: #fffaf7;
  padding: 12px;
  border-radius: 13px;
  margin: 15px 0;
}

.recipe-link-title {
  font-weight: bold;
  margin-bottom: 7px;
}
</style>
</head>

<body>

<header>
  <h1>🍳 刘太厨房</h1>
  <p>一家人的点菜 · 食谱</p>
</header>

<nav>

  <button
    class="active"
    onclick="showPage('recipes', this)">
    📖 食谱
  </button>

  <button
    onclick="showPage('add', this)">
    ➕ 添加食谱
  </button>

  <button
    onclick="showPage('today', this)">
    📋 今日菜单
  </button>

</nav>

<main>

<section id="recipes">

  <h2>📖 刘太食谱</h2>

  <div id="recipeList">
    <div class="loading">
      正在读取食谱……
    </div>
  </div>

</section>


<section id="add" class="hidden">

  <h2>➕ 添加新食谱</h2>

  <div class="card">

    <label>菜名</label>

    <input
      id="recipeName"
      placeholder="例如：黑椒鸡扒">


    <label>分类</label>

    <select id="recipeCategory">

      <option>鸡肉</option>
      <option>猪肉</option>
      <option>牛肉</option>
      <option>鸡蛋</option>
      <option>鱼</option>
      <option>虾</option>
      <option>海鲜</option>
      <option>蔬菜</option>
      <option>汤</option>
      <option>意面</option>
      <option>饭</option>
      <option>面食</option>
      <option>点心</option>
      <option>甜点</option>
      <option>早餐</option>
      <option>其他</option>

    </select>


    <label>材料</label>

    <textarea
      id="recipeIngredients"
      rows="6"
      placeholder="例如：
鸡扒 2块
黑胡椒 1茶匙
洋葱 半个"></textarea>


    <label>做法</label>

    <textarea
      id="recipeInstructions"
      rows="8"
      placeholder="例如：
1. 鸡扒洗净。
2. 加入调味料腌制。
3. 平底锅煎熟。"></textarea>


    <!-- 🔗 新增 Link -->

    <label>🔗 食谱 Link（可选）</label>

    <input
      id="recipeLink"
      type="url"
      placeholder="例如：https://www.youtube.com/...">


    <button
      class="action"
      id="saveButton"
      onclick="addRecipe()">

      保存食谱 ❤️

    </button>

  </div>

</section>


<section id="today" class="hidden">

  <h2>📋 今日菜单</h2>

  <div id="todayList">

    <div class="loading">
      正在读取今日菜单……
    </div>

  </div>

</section>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

/*
   ⚠️ 把这里换成你原本已经成功使用的 URL 和 Key
*/

const SUPABASE_URL =
  "https://vgkjqpzktytadjavgzzn.supabase.co/rest/v1";

const SUPABASE_KEY =
  "sb_publishable_4ULyasIw_XqkjnLYbs90LA_MVrn1Ami";


let recipes = [];


/* =====================================================
   Supabase URL
===================================================== */

function supabaseBaseURL() {

  return String(SUPABASE_URL)
    .trim()
    .replace(/\/+$/, "");

}


/* =====================================================
   Supabase Key
===================================================== */

function supabaseKey() {

  return String(SUPABASE_KEY)
    .trim();

}


/* =====================================================
   读取食谱
===================================================== */

async function loadRecipes() {

  const box =
    document.getElementById("recipeList");

  box.innerHTML =
    '<div class="loading">正在读取食谱……</div>';

  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes?select=*&order=created_at.desc";

    const key =
      supabaseKey();

    const response =
      await fetch(url, {

        method: "GET",

        headers: {

          "apikey": key,

          "Authorization":
            "Bearer " + key

        }

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Supabase recipe error:",
        response.status,
        errorText
      );

      box.innerHTML =
        '<div class="empty">菜谱读取失败 😢</div>';

      return;
    }

    recipes =
      await response.json();

    renderRecipes();

  }

  catch (error) {

    console.error(
      "Recipe connection error:",
      error
    );

    box.innerHTML =
      '<div class="empty">菜谱读取失败 😢</div>';

  }

}


/* =====================================================
   显示食谱
===================================================== */

function renderRecipes() {

  const box =
    document.getElementById("recipeList");

  if (!recipes.length) {

    box.innerHTML =
      '<div class="empty">还没有食谱 😊<br>点击「➕ 添加食谱」开始吧！</div>';

    return;
  }

  box.innerHTML =

    recipes.map(function(recipe) {

      return `

        <div class="card">

          <div class="food">
            🍽️
          </div>

          <h2>
            ${escapeHTML(recipe.name)}
          </h2>

          <span class="tag">
            ${escapeHTML(recipe.category || "其他")}
          </span>


          <p>
            <b>材料：</b><br>
            ${escapeHTML(recipe.ingredients || "")}
          </p>


          <p>
            <b>做法：</b><br>
            ${escapeHTML(recipe.instructions || "")}
          </p>


          ${
            recipe.link
              ? `

                <div class="recipe-link-box">

                  <div class="recipe-link-title">
                    🔗 食谱 Link
                  </div>

                  <a
                    class="link-button"
                    href="${escapeHTML(recipe.link)}"
                    target="_blank"
                    rel="noopener noreferrer">

                    ▶️ 打开食谱

                  </a>

                </div>

              `
              : ""
          }


          <button
            class="action"
            onclick="orderRecipe('${recipe.id}')">

            我要吃 ❤️

          </button>


          <br><br>


          <button
            class="delete"
            onclick="deleteRecipe('${recipe.id}')">

            🗑️ 删除食谱

          </button>

        </div>

      `;

    }).join("");

}


/* =====================================================
   添加食谱
===================================================== */

async function addRecipe() {

  const name =
    document
      .getElementById("recipeName")
      .value
      .trim();


  const category =
    document
      .getElementById("recipeCategory")
      .value;


  const ingredients =
    document
      .getElementById("recipeIngredients")
      .value
      .trim();


  const instructions =
    document
      .getElementById("recipeInstructions")
      .value
      .trim();


  /* 🔗 读取 Link */

  const link =
    document
      .getElementById("recipeLink")
      .value
      .trim();


  if (!name) {

    alert(
      "请先填写菜名 ❤️"
    );

    return;

  }


  const saveButton =
    document.getElementById("saveButton");

  saveButton.disabled = true;

  saveButton.textContent =
    "正在保存……";


  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes";

    const key =
      supabaseKey();


    const response =
      await fetch(url, {

        method: "POST",

        headers: {

          "apikey": key,

          "Authorization":
            "Bearer " + key,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },


        body: JSON.stringify({

          name: name,

          category: category,

          ingredients: ingredients,

          instructions: instructions,

          /* 🔗 没有 Link 就保存 NULL */

          link: link || null

        })

      });


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Save error:",
        response.status,
        errorText
      );

      alert(
        "保存失败 😢\n" +
        errorText
      );

      return;

    }


    alert(
      "食谱保存成功 ❤️"
    );


    document
      .getElementById("recipeName")
      .value = "";


    document
      .getElementById("recipeIngredients")
      .value = "";


    document
      .getElementById("recipeInstructions")
      .value = "";


    document
      .getElementById("recipeLink")
      .value = "";


    await loadRecipes();


    showPage(
      "recipes",
      document.querySelector("nav button")
    );

  }


  catch (error) {

    console.error(
      "Save connection error:",
      error
    );

    alert(
      "无法连接数据库 😢"
    );

  }


  finally {

    saveButton.disabled = false;

    saveButton.textContent =
      "保存食谱 ❤️";

  }

}


/* =====================================================
   删除食谱
===================================================== */

async function deleteRecipe(id) {

  const password =
    prompt(
      "请输入删除密码："
    );


  if (password === null) {

    return;

  }


  if (password !== "1") {

    alert(
      "密码错误 ❌"
    );

    return;

  }


  const confirmDelete =
    confirm(
      "确定要删除这个食谱吗？"
    );


  if (!confirmDelete) {

    return;

  }


  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes?id=eq." +
      encodeURIComponent(id);


    const key =
      supabaseKey();


    const response =
      await fetch(url, {

        method: "DELETE",

        headers: {

          "apikey": key,

          "Authorization":
            "Bearer " + key

        }

      });


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Delete recipe error:",
        response.status,
        errorText
      );

      alert(
        "删除失败 😢\n" +
        errorText
      );

      return;

    }


    alert(
      "食谱已经删除 ❤️"
    );


    await loadRecipes();

  }


  catch (error) {

    console.error(
      "Delete recipe connection error:",
      error
    );

    alert(
      "删除失败 😢"
    );

  }

}


/* =====================================================
   ❤️ 我要吃
===================================================== */

async function orderRecipe(id) {

  const recipe =
    recipes.find(function(item) {

      return String(item.id) ===
        String(id);

    });


  if (!recipe) {

    return;

  }


  const orderedBy =
    prompt(
      "谁点这道菜？\n\n请输入名字，例如：\n我\n老公"
    );


  if (orderedBy === null) {

    return;

  }


  const person =
    orderedBy.trim();


  if (!person) {

    alert(
      "请输入名字 ❤️"
    );

    return;

  }


  try {

    const url =
      supabaseBaseURL() +
      "/family_orders";


    const key =
      supabaseKey();


    const response =
      await fetch(url, {

        method: "POST",

        headers: {

          "apikey": key,

          "Authorization":
            "Bearer " + key,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },


        body: JSON.stringify({

          recipe_name:
            recipe.name,

          ordered_by:
            person

        })

      });


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Order error:",
        response.status,
        errorText
      );

      alert(
        "加入今日菜单失败 😢\n" +
        errorText
      );

      return;

    }


    alert(
      recipe.name +
      " 已加入今日菜单 ❤️"
    );


    await loadTodayOrders();

  }


  catch (error) {

    console.error(
      "Order connection error:",
      error
    );

    alert(
      "无法连接数据库 😢"
    );

  }

}


/* =====================================================
   📋 读取今日菜单
===================================================== */

async function loadTodayOrders() {

  const box =
    document.getElementById("todayList");


  box.innerHTML =
    '<div class="loading">正在读取今日菜单……</div>';


  try {

    const url =
      supabaseBaseURL() +
      "/family_orders?select=*&order=created_at.desc";


    const key =
      supabaseKey();


    const response =
      await fetch(url, {

        method: "GET",

        headers: {

          "apikey": key,

          "Authorization":
            "Bearer " + key

        }

      });


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Today orders error:",
        response.status,
        errorText
      );

      box.innerHTML =
        '<div class="empty">今日菜单读取失败 😢</div>';

      return;

    }


    const allOrders =
      await response.json();


    const today =
      new Date();


    const orders =
      allOrders.filter(function(order) {

        if (!order.created_at) {

          return false;

        }


        const orderDate =
          new Date(order.created_at);


        return (

          orderDate.getFullYear() ===
            today.getFullYear()

          &&

          orderDate.getMonth() ===
            today.getMonth()

          &&

          orderDate.getDate() ===
            today.getDate()

        );

      });


    renderToday(orders);

  }


  catch (error) {

    console.error(
      "Today orders connection error:",
      error
    );

    box.innerHTML =
      '<div class="empty">今日菜单读取失败 😢</div>';

  }

}


/* =====================================================
   显示今日菜单
===================================================== */

function renderToday(orders) {

  const box =
    document.getElementById("todayList");


  if (!orders.length) {

    box.innerHTML =
      '<div class="empty">今天还没有人点菜 😊</div>';

    return;

  }


  box.innerHTML =

    orders.map(function(item) {

      const time =
        item.created_at
          ? new Date(
              item.created_at
            ).toLocaleTimeString(
              "zh-CN",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            )
          : "";


      return `

        <div class="card">

          <h2>
            🍽️ ${escapeHTML(item.recipe_name)}
          </h2>


          <p>

            👤
            <b>
              ${escapeHTML(
                item.ordered_by || "家人"
              )}
            </b>

          </p>


          <p>
            点菜时间：
            ${escapeHTML(time)}
          </p>


          <button
            class="delete"
            onclick="removeOrder('${item.id}')">

            取消

          </button>

        </div>

      `;

    }).join("");

}


/* =====================================================
   取消今日菜单
===================================================== */

async function removeOrder(id) {

  const confirmRemove =
    confirm(
      "确定取消这道菜吗？"
    );


  if (!confirmRemove) {

    return;

  }


  try {

    const url =
      supabaseBaseURL() +
      "/family_orders?id=eq." +
      encodeURIComponent(id);


    const key =
      supabaseKey();


    const response =
      await fetch(url, {

        method: "DELETE",

        headers: {

          "apikey": key,

          "Authorization":
            "Bearer " + key

        }

      });


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Remove order error:",
        response.status,
        errorText
      );

      alert(
        "取消失败 😢\n" +
        errorText
      );

      return;

    }


    await loadTodayOrders();

  }


  catch (error) {

    console.error(
      "Remove order connection error:",
      error
    );

    alert(
      "无法连接数据库 😢"
    );

  }

}


/* =====================================================
   页面切换
===================================================== */

function showPage(page, button) {

  document
    .getElementById("recipes")
    .classList.add("hidden");


  document
    .getElementById("add")
    .classList.add("hidden");


  document
    .getElementById("today")
    .classList.add("hidden");


  document
    .getElementById(page)
    .classList.remove("hidden");


  document
    .querySelectorAll("nav button")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });


  if (button) {

    button.classList.add("active");

  }


  if (page === "recipes") {

    loadRecipes();

  }


  if (page === "today") {

    loadTodayOrders();

  }

}


/* =====================================================
   安全显示文字
===================================================== */

function escapeHTML(text) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   启动
===================================================== */

loadRecipes();

loadTodayOrders();

</script>

</body>
</html>

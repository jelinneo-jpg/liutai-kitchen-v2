<script>
const SUPABASE_URL = "https://vgkjqpzktytadjavgzzn.supabase.co/rest/v1";
const SUPABASE_KEY = "sb_publishable_4ULyasIw_XqkjnLYbs90LA_MVrn1Ami";

let recipes = [];
let selectedCategory = "";

const categories = [
  { name: "鸡肉", icon: "🐔" },
  { name: "猪肉", icon: "🐷" },
  { name: "牛肉", icon: "🐮" },
  { name: "鸡蛋", icon: "🥚" },
  { name: "鱼", icon: "🐟" },
  { name: "海鲜", icon: "🦐" },
  { name: "蔬菜", icon: "🥬" },
  { name: "饭", icon: "🍚" },
  { name: "面食", icon: "🍜" },
  { name: "意大利面", icon: "🍝" },
  { name: "汤", icon: "🍲" },
  { name: "点心", icon: "🥟" },
  { name: "甜点", icon: "🍰" },
  { name: "早餐", icon: "🍳" },
  { name: "其他", icon: "🍽️" }
];

function supabaseBaseURL() {
  return String(SUPABASE_URL).trim().replace(/\/+$/, "");
}

function supabaseKey() {
  return String(SUPABASE_KEY).trim();
}

function getCategoryIcon(category) {
  const found = categories.find(function(item) {
    return item.name === category;
  });

  return found ? found.icon : "🍽️";
}

function renderCategoryOptions() {
  const box = document.getElementById("categoryGrid");

  box.innerHTML = categories.map(function(category) {
    const selected =
      selectedCategory === category.name ? "selected" : "";

    return `
      <button
        type="button"
        class="category-option ${selected}"
        onclick="selectCategory('${category.name}')">

        <span class="category-icon">
          ${category.icon}
        </span>

        ${category.name}

      </button>
    `;
  }).join("");
}

function selectCategory(category) {
  selectedCategory = category;
  renderCategoryOptions();
}


/* ================================
   读取食物
================================ */

async function loadRecipes() {
  const box = document.getElementById("recipeList");

  box.innerHTML =
    '<div class="loading">正在读取食物……</div>';

  try {
    const url =
      supabaseBaseURL() +
      "/family_recipes?select=*&order=created_at.desc";

    const response = await fetch(url, {
      method: "GET",
      headers: {
        "apikey": supabaseKey(),
        "Authorization": "Bearer " + supabaseKey()
      }
    });

    if (!response.ok) {
      const errorText = await response.text();

      console.error(
        "Recipe error:",
        response.status,
        errorText
      );

      box.innerHTML =
        '<div class="empty">食物读取失败 😢</div>';

      return;
    }

    recipes = await response.json();

    renderRecipes();

  } catch (error) {
    console.error("Recipe connection error:", error);

    box.innerHTML =
      '<div class="empty">食物读取失败 😢</div>';
  }
}


/* ================================
   显示食物
================================ */

function renderRecipes() {
  const box = document.getElementById("recipeList");

  if (!recipes.length) {
    box.innerHTML =
      '<div class="empty">还没有食物 😊<br>点击「➕ 添加食物」开始吧！</div>';

    return;
  }

  box.innerHTML = recipes.map(function(recipe) {

    const icon = getCategoryIcon(recipe.category);

    return `
      <div class="card">

        <div class="food-icon">
          ${icon}
        </div>

        <h2 class="food-name">
          ${escapeHTML(recipe.name)}
        </h2>

        <span class="tag">
          ${icon}
          ${escapeHTML(recipe.category || "其他")}
        </span>

        <div class="action-row">

          <button
            class="action me"
            onclick="orderRecipe('${recipe.id}', '我')">

            ❤️ 我点

          </button>

          <button
            class="action husband"
            onclick="orderRecipe('${recipe.id}', '老公')">

            ❤️ 老公点

          </button>

        </div>

        <br>

        <button
          class="delete"
          onclick="deleteRecipe('${recipe.id}')">

          🗑️ 删除食物

        </button>

      </div>
    `;

  }).join("");
}


/* ================================
   添加食物
================================ */

async function addRecipe() {

  const name =
    document.getElementById("recipeName").value.trim();

  if (!name) {
    alert("请先填写食物名字 ❤️");
    return;
  }

  if (!selectedCategory) {
    alert("请选择一个分类 ❤️");
    return;
  }

  const saveButton =
    document.getElementById("saveButton");

  saveButton.disabled = true;
  saveButton.textContent = "正在保存……";

  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes";

    const response = await fetch(url, {
      method: "POST",

      headers: {
        "apikey": supabaseKey(),
        "Authorization": "Bearer " + supabaseKey(),
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },

      body: JSON.stringify({
        name: name,
        category: selectedCategory,
        ingredients: "",
        instructions: ""
      })
    });

    if (!response.ok) {

      const errorText = await response.text();

      console.error(
        "Save error:",
        response.status,
        errorText
      );

      alert(
        "保存失败 😢\n" + errorText
      );

      return;
    }

    alert("食物保存成功 ❤️");

    document.getElementById("recipeName").value = "";

    selectedCategory = "";

    renderCategoryOptions();

    await loadRecipes();

    showPage(
      "recipes",
      document.querySelector("nav button")
    );

  } catch (error) {

    console.error(
      "Save connection error:",
      error
    );

    alert("无法连接数据库 😢");

  } finally {

    saveButton.disabled = false;
    saveButton.textContent = "保存食物 ❤️";

  }
}


/* ================================
   删除食物
================================ */

async function deleteRecipe(id) {

  const password = prompt("请输入删除密码：");

  if (password === null) {
    return;
  }

  if (password !== "1") {
    alert("密码错误 ❌");
    return;
  }

  const confirmDelete =
    confirm("确定要删除这个食物吗？");

  if (!confirmDelete) {
    return;
  }

  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes?id=eq." +
      encodeURIComponent(id);

    const response = await fetch(url, {
      method: "DELETE",

      headers: {
        "apikey": supabaseKey(),
        "Authorization": "Bearer " + supabaseKey()
      }
    });

    if (!response.ok) {

      const errorText = await response.text();

      alert(
        "删除失败 😢\n" + errorText
      );

      return;
    }

    alert("食物已经删除 ❤️");

    await loadRecipes();

  } catch (error) {

    console.error(
      "Delete recipe error:",
      error
    );

    alert("删除失败 😢");
  }
}


/* ================================
   ❤️ 点菜
   注意：
   Supabase 字段是小写
   recipe_name
   ordered_by
================================ */

async function orderRecipe(id, person) {

  const recipe =
    recipes.find(function(item) {
      return String(item.id) === String(id);
    });

  if (!recipe) {
    return;
  }

  const confirmOrder =
    confirm(
      "确定要点：\n\n" +
      recipe.name +
      "\n\n点菜人：" +
      person
    );

  if (!confirmOrder) {
    return;
  }

  try {

    const url =
      supabaseBaseURL() +
      "/family_orders";

    const response = await fetch(url, {

      method: "POST",

      headers: {
        "apikey": supabaseKey(),
        "Authorization": "Bearer " + supabaseKey(),
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },

      body: JSON.stringify({

        recipe_name: recipe.name,

        ordered_by: person

      })
    });

    if (!response.ok) {

      const errorText = await response.text();

      console.error(
        "Order error:",
        response.status,
        errorText
      );

      alert(
        "加入今日菜单失败 😢\n" +
        errorText
      );

      return;
    }

    alert(
      recipe.name +
      "\n已经加入今日菜单 ❤️"
    );

    await loadTodayOrders();

  } catch (error) {

    console.error(
      "Order connection error:",
      error
    );

    alert(
      "无法连接今日菜单 😢"
    );
  }
}


/* ================================
   📋 读取今日菜单
   Supabase 字段：
   created_at
================================ */

async function loadTodayOrders() {

  const box =
    document.getElementById("todayList");

  box.innerHTML =
    '<div class="loading">正在读取今日菜单……</div>';

  try {

    const url =
      supabaseBaseURL() +
      "/family_orders?select=*&order=created_at.desc";

    console.log(
      "Reading today's orders:",
      url
    );

    const response = await fetch(url, {

      method: "GET",

      headers: {
        "apikey": supabaseKey(),
        "Authorization": "Bearer " + supabaseKey()
      }
    });

    if (!response.ok) {

      const errorText = await response.text();

      console.error(
        "Today orders error:",
        response.status,
        errorText
      );

      box.innerHTML =
        '<div class="empty">今日菜单读取失败 😢</div>';

      return;
    }

    const allOrders = await response.json();

    const today = new Date();

    const orders =
      allOrders.filter(function(order) {

        if (!order.created_at) {
          return false;
        }

        const orderDate =
          new Date(order.created_at);

        return (

          orderDate.getFullYear() ===
          today.getFullYear()

          &&

          orderDate.getMonth() ===
          today.getMonth()

          &&

          orderDate.getDate() ===
          today.getDate()

        );

      });

    renderToday(orders);

  } catch (error) {

    console.error(
      "Today orders connection error:",
      error
    );

    box.innerHTML =
      '<div class="empty">今日菜单读取失败 😢</div>';
  }
}


/* ================================
   显示今日菜单
================================ */

function renderToday(orders) {

  const box =
    document.getElementById("todayList");

  if (!orders.length) {

    box.innerHTML =
      '<div class="empty">今天还没有人点菜 😊</div>';

    return;
  }

  box.innerHTML =
    orders.map(function(item) {

      const icon =
        getIconFromFoodName(
          item.recipe_name
        );

      const time =
        item.created_at

        ? new Date(
            item.created_at
          ).toLocaleTimeString(
            "zh-CN",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )

        : "";

      return `

        <div class="card">

          <div class="food-icon">
            ${icon}
          </div>

          <h2 class="food-name">

            ${escapeHTML(
              item.recipe_name
            )}

          </h2>

          <div class="today-person">

            ❤️
            ${escapeHTML(
              item.ordered_by || "家人"
            )}

          </div>

          <div class="today-time">

            点菜时间：
            ${escapeHTML(time)}

          </div>

          <br>

          <button
            class="delete"
            onclick="removeOrder('${item.id}')">

            取消

          </button>

        </div>

      `;

    }).join("");
}


/* ================================
   根据食物找图案
================================ */

function getIconFromFoodName(name) {

  const recipe =
    recipes.find(function(item) {

      return item.name === name;

    });

  if (recipe) {

    return getCategoryIcon(
      recipe.category
    );

  }

  return "🍽️";
}


/* ================================
   取消今日菜单
================================ */

async function removeOrder(id) {

  const confirmRemove =
    confirm("确定取消这道菜吗？");

  if (!confirmRemove) {
    return;
  }

  try {

    const url =
      supabaseBaseURL() +
      "/family_orders?id=eq." +
      encodeURIComponent(id);

    const response = await fetch(url, {

      method: "DELETE",

      headers: {
        "apikey": supabaseKey(),
        "Authorization": "Bearer " + supabaseKey()
      }

    });

    if (!response.ok) {

      const errorText =
        await response.text();

      alert(
        "取消失败 😢\n" +
        errorText
      );

      return;
    }

    await loadTodayOrders();

  } catch (error) {

    console.error(
      "Remove order error:",
      error
    );

    alert("无法连接数据库 😢");
  }
}


/* ================================
   页面切换
================================ */

function showPage(page, button) {

  document
    .getElementById("recipes")
    .classList.add("hidden");

  document
    .getElementById("add")
    .classList.add("hidden");

  document
    .getElementById("today")
    .classList.add("hidden");

  document
    .getElementById(page)
    .classList.remove("hidden");

  document
    .querySelectorAll("nav button")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });

  button.classList.add("active");

  if (page === "recipes") {
    loadRecipes();
  }

  if (page === "add") {
    renderCategoryOptions();
  }

  if (page === "today") {
    loadTodayOrders();
  }
}


/* ================================
   安全显示
================================ */

function escapeHTML(text) {

  return String(text)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");
}


/* ================================
   启动
================================ */

renderCategoryOptions();

loadRecipes();

loadTodayOrders();

</script>

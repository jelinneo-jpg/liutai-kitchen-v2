<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>刘太厨房</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8f2;
  color: #3d2b24;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
}

header {
  background: #f4c4a4;
  text-align: center;
  padding: 28px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 15px;
  background: white;
  overflow-x: auto;
}

nav button {
  border: 0;
  border-radius: 20px;
  padding: 10px 15px;
  background: #fff0e5;
  color: #8a573d;
  white-space: nowrap;
  cursor: pointer;
  font-size: 15px;
}

nav button.active {
  background: #e69765;
  color: white;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.food-icon {
  font-size: 52px;
  text-align: center;
  margin-bottom: 5px;
}

.food-name {
  text-align: center;
  margin: 5px 0 10px;
  font-size: 23px;
}

.tag {
  display: block;
  width: fit-content;
  margin: 0 auto 15px;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 13px;
}

.action-row {
  display: flex;
  gap: 8px;
}

button.action {
  flex: 1;
  border: 0;
  background: #e69765;
  color: white;
  padding: 12px 10px;
  border-radius: 14px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

button.action.me {
  background: #e69765;
}

button.action.husband {
  background: #d58b68;
}

button.delete {
  border: 0;
  background: #eee;
  padding: 11px 13px;
  border-radius: 12px;
  cursor: pointer;
  color: #8a4d3b;
  width: 100%;
  font-size: 14px;
}

button.recipe-button {
  width: 100%;
  border: 0;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 12px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 10px;
}

button.save-recipe {
  width: 100%;
  border: 0;
  background: #e69765;
  color: white;
  padding: 13px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
}

button.edit-food {
  width: 100%;
  border: 0;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 12px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 10px;
}

button.back-button {
  border: 0;
  background: #fff0e5;
  color: #8a573d;
  padding: 10px 15px;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 15px;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  margin: 7px 0 12px;
  border: 1px solid #ead8cc;
  border-radius: 12px;
  font-size: 16px;
  background: white;
  font-family: inherit;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.hidden {
  display: none;
}

.empty,
.loading {
  text-align: center;
  padding: 35px;
  color: #987d70;
}

.today-person {
  text-align: center;
  font-size: 16px;
  margin: 8px 0;
}

.today-time {
  text-align: center;
  font-size: 13px;
  color: #987d70;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 5px;
  margin-bottom: 15px;
}

.category-option {
  border: 1px solid #ead8cc;
  background: #fffaf7;
  border-radius: 14px;
  padding: 10px 5px;
  text-align: center;
  cursor: pointer;
  font-size: 13px;
}

.category-option.selected {
  background: #fff0e5;
  border: 2px solid #e69765;
}

.category-icon {
  display: block;
  font-size: 28px;
  margin-bottom: 3px;
}

#foodSearch,
#cookbookSearch {
  width: 100%;
  padding: 14px 16px;
  margin: 5px 0 10px;
  border: 1px solid #ead8cc;
  border-radius: 15px;
  font-size: 16px;
  background: white;
  outline: none;
}

#foodSearch:focus,
#cookbookSearch:focus {
  border-color: #e69765;
  box-shadow: 0 0 0 3px rgba(230,151,101,.12);
}

.search-result-count {
  text-align: center;
  color: #987d70;
  font-size: 13px;
  margin: 0 0 15px;
}

.recipe-section-title {
  font-size: 20px;
  margin: 20px 0 12px;
}

.ingredient-row {
  display: flex;
  gap: 8px;
  margin-bottom: 9px;
  align-items: center;
}

.ingredient-row input:first-child {
  flex: 1.3;
}

.ingredient-row input:nth-child(2) {
  flex: 1;
}

.step-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 9px;
}

.step-number {
  width: 32px;
  min-width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #fff0e5;
  color: #9a5e3d;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.step-row textarea {
  margin: 0;
  min-height: 48px;
  flex: 1;
}

.small-delete {
  width: 38px;
  min-width: 38px;
  height: 38px;
  border: 0;
  border-radius: 10px;
  background: #f1eeee;
  cursor: pointer;
  font-size: 16px;
}

.add-row-button {
  width: 100%;
  border: 1px dashed #d8ad96;
  background: #fffaf7;
  color: #9a5e3d;
  padding: 11px;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 15px;
  font-size: 14px;
}

.recipe-title {
  text-align: center;
  font-size: 26px;
  margin: 5px 0 8px;
}

.recipe-category {
  text-align: center;
  color: #987d70;
  margin-bottom: 20px;
}

.recipe-list-card {
  cursor: pointer;
}

.recipe-link-box {
  display: block;
  width: 100%;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 13px;
  border-radius: 14px;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  margin-bottom: 15px;
}

.recipe-link-input {
  margin-bottom: 15px;
}

.edit-title {
  font-size: 18px;
  margin: 5px 0 8px;
}

@media (max-width: 420px) {

  .food-icon {
    font-size: 48px;
  }

  .ingredient-row {
    gap: 5px;
  }

  .ingredient-row input {
    min-width: 0;
  }

}

</style>

</head>

<script>

/* =====================================================
   ⭐ SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://vgkjqpzktytadjavgzzn.supabase.co/rest/v1";

const SUPABASE_KEY =
  "sb_publishable_4ULyasIw_XqkjnLYbs90LA_MVrn1Ami";


let recipes = [];

let selectedCategory = "";

let currentRecipe = null;


/* =====================================================
   分类
===================================================== */

const categories = [

  { name: "鸡肉", icon: "🐔" },
  { name: "猪肉", icon: "🐷" },
  { name: "牛肉", icon: "🐮" },
  { name: "鸡蛋", icon: "🥚" },
  { name: "鱼", icon: "🐟" },
  { name: "海鲜", icon: "🦐" },
  { name: "蔬菜", icon: "🥬" },
  { name: "饭", icon: "🍚" },
  { name: "面食", icon: "🍜" },
  { name: "意大利面", icon: "🍝" },
  { name: "汤", icon: "🍲" },
  { name: "点心", icon: "🥟" },
  { name: "甜点", icon: "🍰" },
  { name: "早餐", icon: "🍳" },
  { name: "其他", icon: "🍽️" }

];


function supabaseBaseURL() {

  return String(SUPABASE_URL)
    .trim()
    .replace(/\/+$/, "");

}


function supabaseKey() {

  return String(SUPABASE_KEY).trim();

}


function getCategoryIcon(category) {

  const found =
    categories.find(function(item) {

      return item.name === category;

    });

  return found
    ? found.icon
    : "🍽️";

}


function renderCategoryOptions() {

  const box =
    document.getElementById(
      "categoryGrid"
    );

  box.innerHTML =

    categories.map(function(category) {

      const selected =
        selectedCategory === category.name
          ? "selected"
          : "";

      return `

        <button
          type="button"
          class="category-option ${selected}"
          onclick="selectCategory('${category.name}')">

          <span class="category-icon">
            ${category.icon}
          </span>

          ${category.name}

        </button>

      `;

    }).join("");

}


function selectCategory(category) {

  selectedCategory = category;

  renderCategoryOptions();

}


/* =====================================================
   🍽️ 读取食物
===================================================== */

async function loadRecipes() {

  const box =
    document.getElementById(
      "recipeList"
    );

  box.innerHTML =
    '<div class="loading">正在读取食物……</div>';

  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes?select=*&order=created_at.desc";

    const response =
      await fetch(url, {

        method: "GET",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey()

        }

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Recipe error:",
        response.status,
        errorText
      );

      box.innerHTML =
        '<div class="empty">食物读取失败 😢</div>';

      return;

    }

    recipes =
      await response.json();

    renderRecipes();

    renderCookbook();

  }

  catch (error) {

    console.error(
      "Recipe connection error:",
      error
    );

    box.innerHTML =
      '<div class="empty">食物读取失败 😢</div>';

  }

}


/* =====================================================
   🍽️ 显示食物
===================================================== */

function renderRecipes() {

  const box =
    document.getElementById(
      "recipeList"
    );

  if (!recipes.length) {

    box.innerHTML =
      '<div class="empty">还没有食物 😊<br>点击「➕ 添加食物」开始吧！</div>';

    return;

  }

  const searchInput =
    document.getElementById(
      "foodSearch"
    );

  const keyword =
    searchInput
      ? searchInput.value.trim().toLowerCase()
      : "";

  let filteredRecipes =
    recipes;

  if (keyword) {

    filteredRecipes =
      recipes.filter(function(recipe) {

        const name =
          String(recipe.name || "")
            .toLowerCase();

        const category =
          String(recipe.category || "")
            .toLowerCase();

        return (
          name.includes(keyword) ||
          category.includes(keyword)
        );

      });

  }

  if (!filteredRecipes.length) {

    box.innerHTML = `

      <div class="empty">

        😢 找不到「${escapeHTML(keyword)}」

        <br><br>

        试试看其他食物名字或分类

      </div>

    `;

    return;

  }

  box.innerHTML =

    filteredRecipes.map(function(recipe) {

      return recipeCardHTML(recipe);

    }).join("");

}


function recipeCardHTML(recipe) {

  const icon =
    getCategoryIcon(
      recipe.category
    );

  return `

    <div class="card">

      <div class="food-icon">
        ${icon}
      </div>

      <h2 class="food-name">
        ${escapeHTML(recipe.name)}
      </h2>

      <span class="tag">
        ${icon}
        ${escapeHTML(recipe.category || "其他")}
      </span>

      <div class="action-row">

        <button
          class="action me"
          onclick="orderRecipe('${recipe.id}', '我')">

          ❤️ 我点

        </button>

        <button
          class="action husband"
          onclick="orderRecipe('${recipe.id}', '老公')">

          ❤️ 老公点

        </button>

      </div>

      <br>

      <button
        class="edit-food"
        onclick="editFood('${recipe.id}')">

        ✏️ 修改食物

      </button>

      <button
        class="delete"
        onclick="deleteRecipe('${recipe.id}')">

        🗑️ 删除食物

      </button>

    </div>

  `;

}


/* =====================================================
   🔍 搜索食物
===================================================== */

function searchFood() {

  renderRecipes();

}


/* =====================================================
   ➕ 添加食物
===================================================== */

async function addRecipe() {

  const name =
    document
      .getElementById("recipeName")
      .value
      .trim();

  if (!name) {

    alert("请先填写食物名字 ❤️");

    return;

  }

  if (!selectedCategory) {

    alert("请选择一个分类 ❤️");

    return;

  }

  const saveButton =
    document.getElementById(
      "saveButton"
    );

  saveButton.disabled = true;

  saveButton.textContent =
    "正在保存……";

  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes";

    const response =
      await fetch(url, {

        method: "POST",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey(),

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body: JSON.stringify({

          name: name,

          category: selectedCategory,

          ingredients: JSON.stringify([]),

          instructions: JSON.stringify([]),

          recipe_link: null

        })

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      alert(
        "保存失败 😢\n" +
        errorText
      );

      return;

    }

    alert(
      "食物保存成功 ❤️"
    );

    document
      .getElementById("recipeName")
      .value = "";

    selectedCategory = "";

    renderCategoryOptions();

    await loadRecipes();

    showPage(
      "recipes",
      document.querySelector("nav button")
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "无法连接数据库 😢"
    );

  }

  finally {

    saveButton.disabled = false;

    saveButton.textContent =
      "保存食物 ❤️";

  }

}


/* =====================================================
   ✏️ 修改食物名字 / 分类
===================================================== */

async function editFood(id) {

  const recipe =
    recipes.find(function(item) {

      return String(item.id) ===
        String(id);

    });

  if (!recipe) {
    return;
  }

  const newName =
    prompt(
      "修改食物名字：",
      recipe.name
    );

  if (newName === null) {
    return;
  }

  const name =
    newName.trim();

  if (!name) {

    alert("食物名字不能为空 ❤️");

    return;

  }

  let category =
    recipe.category || "其他";

  const categoryText =
    categories
      .map(function(item, index) {

        return (
          (index + 1) +
          ". " +
          item.icon +
          " " +
          item.name
        );

      })
      .join("\n");

  const categoryChoice =
    prompt(

      "请输入新的分类编号：\n\n" +
      categoryText +
      "\n\n目前分类：" +
      category,

      String(
        categories.findIndex(function(item) {
          return item.name === category;
        }) + 1
      )

    );

  if (categoryChoice === null) {
    return;
  }

  const categoryIndex =
    parseInt(categoryChoice, 10) - 1;

  if (
    isNaN(categoryIndex) ||
    !categories[categoryIndex]
  ) {

    alert("分类编号不正确 ❌");

    return;

  }

  category =
    categories[categoryIndex].name;

  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes?id=eq." +
      encodeURIComponent(id);

    const response =
      await fetch(url, {

        method: "PATCH",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey(),

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body: JSON.stringify({

          name: name,

          category: category

        })

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      alert(
        "修改失败 😢\n" +
        errorText
      );

      return;

    }

    alert(
      "食物资料修改成功 ❤️"
    );

    await loadRecipes();

  }

  catch (error) {

    console.error(error);

    alert(
      "无法连接数据库 😢"
    );

  }

}


/* =====================================================
   🗑️ 删除食物
===================================================== */

async function deleteRecipe(id) {

  const password =
    prompt("请输入删除密码：");

  if (password === null) {
    return;
  }

  if (password !== "1") {

    alert("密码错误 ❌");

    return;

  }

  const recipe =
    recipes.find(function(item) {

      return String(item.id) ===
        String(id);

    });

  const confirmDelete =
    confirm(
      "确定要删除「" +
      (recipe
        ? recipe.name
        : "这个食物") +
      "」吗？\n\n删除后食物和保存的食谱资料都会删除。"
    );

  if (!confirmDelete) {
    return;
  }

  try {

    const url =
      supabaseBaseURL() +
      "/family_recipes?id=eq." +
      encodeURIComponent(id);

    const response =
      await fetch(url, {

        method: "DELETE",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey(),

          "Prefer":
            "return=representation"

        }

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      alert(
        "删除失败 😢\n" +
        errorText
      );

      return;

    }

    alert(
      "食物已经删除 ❤️"
    );

    currentRecipe = null;

    await loadRecipes();

  }

  catch (error) {

    console.error(error);

    alert("删除失败 😢");

  }

}


/* =====================================================
   ❤️ 点菜
===================================================== */

async function orderRecipe(id, person) {

  const recipe =
    recipes.find(function(item) {

      return String(item.id) ===
        String(id);

    });

  if (!recipe) {
    return;
  }

  const confirmOrder =
    confirm(

      "确定要点：\n\n" +
      recipe.name +
      "\n\n点菜人：" +
      person

    );

  if (!confirmOrder) {
    return;
  }

  try {

    const url =
      supabaseBaseURL() +
      "/family_orders";

    const response =
      await fetch(url, {

        method: "POST",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey(),

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body: JSON.stringify({

          recipe_name:
            recipe.name,

          ordered_by:
            person

        })

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      alert(

/* =====================================================
   📋 今日菜单
===================================================== */

async function loadTodayOrders() {

  const box =
    document.getElementById(
      "todayList"
    );

  box.innerHTML =
    '<div class="loading">正在读取今日菜单……</div>';

  try {

    const url =
      supabaseBaseURL() +
      "/family_orders?select=*&order=created_at.desc";

    const response =
      await fetch(url, {

        method: "GET",

        headers: {

          "apikey": supabaseKey(),

          "Authorization":
            "Bearer " + supabaseKey()

        }

      });

    if (!response.ok) {

      box.innerHTML =
        '<div class="empty">今日菜单读取失败 😢</div>';

      return;

    }

    const allOrders =
      await response.json();

    const today =
      new Date();

    const orders =
      allOrders.filter(function(order) {

        if (!order.created_at) {
          return false;
        }

        const orderDate =
          new Date(
            order.created_at
          );

        return (

          orderDate.getFullYear() ===
          today.getFullYear()

          &&

          orderDate.getMonth() ===
          today.getMonth()

          &&

          orderDate.getDate() ===
          today.getDate()

        );

      });

    renderToday(orders);

  }

  catch (error) {

    console.error(error);

    box.innerHTML =
      '<div class="empty">今日菜单读取失败 😢</div>';

  }

}


function renderToday(orders) {

  const box =
    document.getElementById(
      "todayList"
    );

  if (!orders.length) {

    box.innerHTML =
      '<div class="empty">今天还没有人点菜 😊</div>';

    return;

  }

  box.innerHTML =

    orders.map(function(item) {

      const icon =
        getIconFromFoodName(
          item.recipe_name
        );

      const time =
        item.created_at

        ? new Date(
            item.created_at
          ).toLocaleTimeString(
            "zh-CN",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )

        : "";

      return `

        <div class="card">

          <div class="food-icon">
            ${icon}
          </div>

          <h2 class="food-name">
            ${escapeHTML(
              item.recipe_name
            )}
          </h2>

          <div class="today-person">
            ❤️
            ${escapeHTML(
              item.ordered_by || "家人"
            )}
          </div>

          <div class="today-time">
            点菜时间：${escapeHTML(time)}
          </div>

          <br>

          <button
            class="delete"
            onclick="removeOrder('${item.id}')">

            取消

          </button>

        </div>

      `;

    }).join("");

}


/* =====================================================
   📖 食谱
===================================================== */

function renderCookbook() {

  const box =
    document.getElementById(
      "cookbookList"
    );

  const searchInput =
    document.getElementById(
      "cookbookSearch"
    );

  const countBox =
    document.getElementById(
      "cookbookResultCount"
    );

  if (!recipes.length) {

    box.innerHTML =
      '<div class="empty">还没有食谱 😊<br>先到「添加食物」增加菜吧！</div>';

    if (countBox) {
      countBox.textContent = "";
    }

    return;

  }

  const keyword =
    searchInput
      ? searchInput.value.trim().toLowerCase()
      : "";

  let filteredRecipes =
    recipes;

  if (keyword) {

    filteredRecipes =
      recipes.filter(function(recipe) {

        const name =
          String(recipe.name || "")
            .toLowerCase();

        const category =
          String(recipe.category || "")
            .toLowerCase();

        return (
          name.includes(keyword) ||
          category.includes(keyword)
        );

      });

  }

  if (countBox) {

    countBox.textContent =
      keyword
        ? "找到 " +
          filteredRecipes.length +
          " 道食谱 ❤️"
        : "";

  }

  if (!filteredRecipes.length) {

    box.innerHTML = `

      <div class="empty">

        😢 找不到「${escapeHTML(keyword)}」的食谱

        <br><br>

        试试看其他食物名字或分类

      </div>

    `;

    return;

  }

  box.innerHTML =

    filteredRecipes.map(function(recipe) {

      const icon =
        getCategoryIcon(
          recipe.category
        );

      return `

        <div class="card recipe-list-card">

          <div
            onclick="openRecipe('${recipe.id}')">

            <div class="food-icon">
              ${icon}
            </div>

            <h2 class="food-name">
              ${escapeHTML(recipe.name)}
            </h2>

            <span class="tag">
              ${icon}
              ${escapeHTML(
                recipe.category || "其他"
              )}
            </span>

          </div>

          <button
            class="recipe-button"
            onclick="openRecipe('${recipe.id}')">

            📖 查看 / 编辑食谱

          </button>

          <button
            class="delete"

            🗑️ 删除食谱

    }).join("");

}

/* =====================================================
   📖 材料
===================================================== */

function parseIngredients(recipe) {

  try {

    if (!recipe.ingredients) {
      return [];
    }

    if (Array.isArray(recipe.ingredients)) {
      return recipe.ingredients;
    }

    const data =
      JSON.parse(recipe.ingredients);

    return Array.isArray(data)
      ? data
      : [];

  }

  catch (error) {

    return [];

  }

}


/* =====================================================
   👩‍🍳 做法
===================================================== */

function parseInstructions(recipe) {

  try {

    if (!recipe.instructions) {
      return [];
    }

    if (Array.isArray(recipe.instructions)) {
      return recipe.instructions;
    }

    const data =
      JSON.parse(recipe.instructions);

    return Array.isArray(data)
      ? data
      : [];

  }

  catch (error) {

    return [];

  }

}


/* =====================================================
   🔗 Link
===================================================== */

function normalizeRecipeLink(link) {

  const value =
    String(link || "").trim();

  if (!value) {
    return "";
  }

  if (
    value.startsWith("https://") ||
    value.startsWith("http://")
  ) {

    return value;

  }

  return "https://" + value;

}

function ingredientEditorHTML(item, index) {

  const name =

  return `

    <div class="ingredient-row">

      <input
        class="ingredient-name"
        placeholder="材料，例如：鸡腿肉"
        value="${escapeHTML(name)}">

        class="ingredient-amount"
        placeholder="分量，例如：2块"

      <button
        type="button"
        class="small-delete"

function addIngredientRow() {

    document.getElementById(
      "ingredientEditor"

    document.createElement("div");

    ingredientEditorHTML(

        name: "",
        amount: ""

  box.appendChild(
    div.firstElementChild

}


function stepEditorHTML(item, index) {

  return `

    <div class="step-row">

      <div class="step-number">
        ${index + 1}

      <textarea
        class="step-text"
        placeholder="请输入这个步骤……">${escapeHTML(item || "")}</textarea>

```
  <button
    type="button"
    class="small-delete"
    onclick="removeStep(this)">

    🗑️

  </button>

</div>
```

`;

}

function addStepRow() {

const box =
document.getElementById(
"stepEditor"
);

const index =
box.children.length;

const div =
document.createElement("div");

div.innerHTML =
stepEditorHTML(
"",
index

document.querySelectorAll(
"#stepEditor .step-row"

rows.forEach(function(row, index) {

```

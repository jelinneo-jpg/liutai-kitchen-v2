function supabaseBaseURL() {

    .trim()
    .replace(/\/+$/, "");

  return String(SUPABASE_KEY).trim();

/* =====================================================
   🔐 Supabase 请求
   加入 timeout，避免一直卡在「正在读取」
===================================================== */

async function supabaseFetch(endpoint, options = {}) {

  const controller = new AbortController();

  const timeout = setTimeout(function() {
    controller.abort();
  }, 15000);

  try {

    const response = await fetch(
      supabaseBaseURL() + endpoint,
      {
        ...options,
        signal: controller.signal,
        headers: {
          "apikey": supabaseKey(),
          "Authorization": "Bearer " + supabaseKey(),
          ...(options.headers || {})
        }
      }
    );

    return response;

  } catch (error) {

    if (error.name === "AbortError") {
      throw new Error("连接数据库超时，请检查 Supabase。");
    }

    throw error;

  } finally {

    clearTimeout(timeout);

  }

}

  }

  finally {

async function deleteRecipe(id) {

  const password =
    prompt("请输入删除密码：");

  if (password === null) return;

  if (password !== "1") {

    alert("密码错误 ❌");

    return;

  }

  const recipe =
    recipes.find(function(item) {

      return String(item.id) === String(id);

    });

  if (!recipe) {

    alert("找不到这个食物 😢");

    return;

  }

  const confirmDelete =
    confirm(
      "确定要删除「" +
      recipe.name +
      "」吗？\n\n删除后食物和保存的食谱资料都会删除。"
    );

  if (!confirmDelete) return;

  try {

    const response =
      await supabaseFetch(
        "/family_recipes?id=eq." +
        encodeURIComponent(id),
        {
          method: "DELETE",

          headers: {
            "Prefer": "return=representation"
          }
        }
      );

    const text =
      await response.text();

    if (!response.ok) {

      console.error(
        "Delete error:",
        response.status,
        text
      );

      alert(
        "删除失败 😢\n\n" + text
      );

      return;

    }

    alert("「" + recipe.name + "」已经删除 ❤️");

    currentRecipe = null;

    await loadRecipes();

  }

  catch (error) {

    console.error(error);

    alert(
      "删除失败 😢\n\n" +
      error.message
    );

  }

}

async function loadTodayOrders() {

  const box =
    document.getElementById("todayList");

  if (!box) return;

  box.innerHTML =
    '<div class="loading">正在读取今日菜单……</div>';

  try {

    const response =
      await supabaseFetch(
        "/family_orders?select=*&order=created_at.desc",
        {
          method: "GET"
        }
      );

    const text =
      await response.text();

    if (!response.ok) {

      box.innerHTML = `
        <div class="empty">
          😢 今日菜单读取失败
          <br><br>
          <small>${escapeHTML(text)}</small>
          <br><br>
          <button
            class="action"
            onclick="loadTodayOrders()">
            🔄 重新读取
          </button>
        </div>
      `;

      return;

    }

    const allOrders =
      text ? JSON.parse(text) : [];

    const today =
      new Date();

    const orders =
      allOrders.filter(function(order) {

        if (!order.created_at) return false;

        const date =
          new Date(order.created_at);

        return (
          date.getFullYear() === today.getFullYear() &&
          date.getMonth() === today.getMonth() &&
          date.getDate() === today.getDate()
        );

      });

    renderToday(orders);

  }

  catch (error) {

    console.error(error);

    box.innerHTML = `
      <div class="empty">

        😢 今日菜单读取失败

        <br><br>

        ${escapeHTML(error.message || "")}

        <br><br>

        <button
          class="action"
          onclick="loadTodayOrders()">

          🔄 再试一次

        </button>

      </div>
    `;

  }

}

function parseIngredients(recipe) {

  try {

    if (!recipe.ingredients) return [];

    if (Array.isArray(recipe.ingredients)) {
      return recipe.ingredients;
    }

    const data =
      JSON.parse(recipe.ingredients);

    return Array.isArray(data) ? data : [];

  }

  catch (error) {

    console.error(error);

    return [];

  }

}

      return recipe.instructions;
    }

    const data =

/* =====================================================
   🔗 Link
===================================================== */

function normalizeRecipeLink(link) {

  const value =
    String(link || "").trim();

  if (!value) return "";

  if (
    value.startsWith("https://") ||
    value.startsWith("http://")
  ) {
    return value;
  }

  return "https://" + value;

}

/* =====================================================

===================================================== */

function removeStep(button) {

  if (!button) return;

  button.parentElement.remove();

  refreshStepNumbers();

}


/* =====================================================
   自动编号
===================================================== */

function refreshStepNumbers() {

  const rows =
    document.querySelectorAll(
      "#stepEditor .step-row"
    );

  rows.forEach(function(row, index) {

    const number =
      row.querySelector(".step-number");

    if (number) {
      number.textContent = index + 1;
    }

  });

}


/* =====================================================
   💾 保存食谱
===================================================== */

async function saveRecipeDetail() {

  if (!currentRecipe) return;

  const ingredientRows =
    document.querySelectorAll(
      "#ingredientEditor .ingredient-row"
    );

  const ingredients = [];

  ingredientRows.forEach(function(row) {

    const name =
      row.querySelector(
        ".ingredient-name"
      ).value.trim();

    const amount =
      row.querySelector(
        ".ingredient-amount"
      ).value.trim();

    if (name || amount) {

      ingredients.push({
        name: name,
        amount: amount
      });

    }

  });


  const stepRows =
    document.querySelectorAll(
      "#stepEditor .step-row"
    );

  const instructions = [];

  stepRows.forEach(function(row) {

    const text =
      row.querySelector(
        ".step-text"
      ).value.trim();

    if (text) {
      instructions.push(text);
    }

  });


  const recipeLinkInput =
    document.getElementById("recipeLink");

  const recipeLink =
    recipeLinkInput
      ? recipeLinkInput.value.trim()
      : "";


  try {

    const response =
      await supabaseFetch(
        "/family_recipes?id=eq." +
        encodeURIComponent(currentRecipe.id),
        {
          method: "PATCH",

          headers: {
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },

          body: JSON.stringify({

            ingredients:
              JSON.stringify(ingredients),

            instructions:
              JSON.stringify(instructions),

            recipe_link:
              recipeLink || null

          })

        }
      );


    const text =
      await response.text();


    if (!response.ok) {

      alert(
        "食谱保存失败 😢\n\n" +
        text
      );

      return;

    }


    alert("食谱保存成功 ❤️");


    await loadRecipes();


    const updatedRecipe =
      recipes.find(function(item) {

        return String(item.id) ===
          String(currentRecipe.id);

      });


    if (updatedRecipe) {

      currentRecipe =
        updatedRecipe;

    }


    renderRecipeDetail();

  }

  catch (error) {

    console.error(error);

    alert(
      "无法连接数据库 😢\n\n" +
      error.message
    );

  }

}

async function removeOrder(id) {

    confirm("确定取消这道菜吗？");

  try {

/* =====================================================
   页面切换
===================================================== */

function showPage(page, button) {

  const pages = [
    "recipes",
    "add",
    "today",
    "cookbook",
    "recipeDetail"
  ];

  pages.forEach(function(pageName) {

    const section =
      document.getElementById(pageName);

    if (section) {

      section.classList.add("hidden");

    }

  });


  const target =
    document.getElementById(page);

  if (target) {

    target.classList.remove("hidden");

  }


  document
    .querySelectorAll("nav button")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });


  if (button) {

    button.classList.add("active");

  }


  if (page === "recipes") {

    loadRecipes();

  }


  if (page === "add") {

    renderCategoryOptions();

  }


  if (page === "today") {

    loadTodayOrders();

  }


  if (page === "cookbook") {

    loadRecipes();

  }

}

function escapeHTML(text) {

  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

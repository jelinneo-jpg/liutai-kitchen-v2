<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刘太厨房</title>

<style>
body {
  margin: 0;
  background: #fff8f2;
  color: #3d2b24;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
}

header {
  background: #f4c4a4;
  text-align: center;
  padding: 30px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 15px;
  background: white;
  overflow-x: auto;
}

nav button {
  border: 0;
  border-radius: 20px;
  padding: 10px 15px;
  background: #fff0e5;
  color: #8a573d;
  white-space: nowrap;
  cursor: pointer;
}

nav button.active {
  background: #e69765;
  color: white;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.food {
  font-size: 42px;
}

.tag {
  display: inline-block;
  background: #fff0e5;
  color: #9a5e3d;
  padding: 5px 9px;
  border-radius: 10px;
  font-size: 13px;
}

button.action {
  border: 0;
  background: #e69765;
  color: white;
  padding: 11px 17px;
  border-radius: 14px;
  font-weight: bold;
  cursor: pointer;
}

button.action:disabled {
  opacity: .6;
}

button.delete {
  border: 0;
  background: #eee;
  padding: 8px 12px;
  border-radius: 12px;
  cursor: pointer;
}

input,
textarea,
select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 7px 0 14px;
  border: 1px solid #ead8cc;
  border-radius: 12px;
  font-size: 16px;
}

.hidden {
  display: none;
}

.empty,
.loading {
  text-align: center;
  padding: 35px;
  color: #987d70;
}
</style>
</head>

<body>

<header>
  <h1>🍳 刘太厨房</h1>
  <p>一家人的点菜 · 食谱</p>
</header>

<nav>
  <button class="active" onclick="showPage('recipes', this)">
    📖 食谱
  </button>

  <button onclick="showPage('add', this)">
    ➕ 添加食谱
  </button>

  <button onclick="showPage('today', this)">
    📋 今日菜单
  </button>
</nav>

<main>

<section id="recipes">
  <h2>📖 刘太食谱</h2>

  <div id="recipeList">
    <div class="loading">正在读取食谱……</div>
  </div>
</section>


<section id="add" class="hidden">

  <h2>➕ 添加新食谱</h2>

  <div class="card">

    <label>菜名</label>
    <input id="recipeName" placeholder="例如：黑椒鸡扒">

    <label>分类</label>

    <select id="recipeCategory">
      <option>鸡肉</option>
      <option>猪肉</option>
      <option>牛肉</option>
      <option>鱼</option>
      <option>虾</option>
      <option>汤</option>
      <option>意面</option>
      <option>饭</option>
      <option>其他</option>
    </select>

    <label>材料</label>

    <textarea
      id="recipeIngredients"
      rows="6"
      placeholder="例如：鸡扒、黑胡椒、洋葱……"></textarea>

    <label>做法</label>

    <textarea
      id="recipeInstructions"
      rows="8"
      placeholder="写下做法……"></textarea>

    <button
      class="action"
      id="saveButton"
      onclick="addRecipe()">
      保存食谱 ❤️
    </button>

  </div>
</section>


<section id="today" class="hidden">

  <h2>📋 今日菜单</h2>

  <div id="todayList"></div>

</section>

</main>


<script>

/* =====================================================
   SUPABASE
   =====================================================

   ⚠️ 只需要填下面两行。
   你的 Data API URL 已经包含 /rest/v1，
   所以下面的代码不会再次加入 /rest/v1。
*/

const SUPABASE_URL = "https://vgkjqpzktytadjavgzzn.supabase.co/rest/v1/";
const SUPABASE_KEY = "在sb_publishable_4ULyasIw_XqkjnLYbs90LA_MVrn1Ami";


let recipes = [];


/* =====================================================
   读取食谱
   ===================================================== */

async function loadRecipes() {

  const box = document.getElementById("recipeList");

  box.innerHTML =
    '<div class="loading">正在读取食谱……</div>';

  try {

    const url =
      SUPABASE_URL +
      "/family_recipes?select=*&order=created_at.desc";

    console.log("Reading:", url);

    const response = await fetch(url, {
      method: "GET",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });


    if (!response.ok) {

      const errorText = await response.text();

      console.error(
        "Supabase error:",
        response.status,
        errorText
      );

      box.innerHTML =
        '<div class="empty">菜谱读取失败 😢</div>';

      return;
    }


    recipes = await response.json();

    renderRecipes();

  } catch (error) {

    console.error(
      "Connection error:",
      error
    );

    box.innerHTML =
      '<div class="empty">菜谱读取失败 😢</div>';
  }
}


/* =====================================================
   显示食谱
   ===================================================== */

function renderRecipes() {

  const box =
    document.getElementById("recipeList");


  if (!recipes.length) {

    box.innerHTML =
      '<div class="empty">还没有食谱 😊<br>点击「➕ 添加食谱」开始吧！</div>';

    return;
  }


  box.innerHTML =
    recipes.map(function(recipe) {

      return `
        <div class="card">

          <div class="food">🍽️</div>

          <h2>
            ${escapeHTML(recipe.name)}
          </h2>

          <span class="tag">
            ${escapeHTML(recipe.category || "其他")}
          </span>

          <p>
            <b>材料：</b><br>
            ${escapeHTML(recipe.ingredients || "")}
          </p>

          <p>
            <b>做法：</b><br>
            ${escapeHTML(recipe.instructions || "")}
          </p>

          <button
            class="action"
            onclick="orderRecipe('${recipe.id}')">

            我要吃 ❤️

          </button>

        </div>
      `;

    }).join("");
}


/* =====================================================
   添加食谱
   ===================================================== */

async function addRecipe() {

  const name =
    document.getElementById("recipeName").value.trim();

  const category =
    document.getElementById("recipeCategory").value;

  const ingredients =
    document.getElementById("recipeIngredients").value.trim();

  const instructions =
    document.getElementById("recipeInstructions").value.trim();


  if (!name) {

    alert("请先填写菜名 ❤️");

    return;
  }


  const saveButton =
    document.getElementById("saveButton");


  saveButton.disabled = true;

  saveButton.textContent =
    "正在保存……";


  try {

    const url =
      SUPABASE_URL +
      "/family_recipes";


    const response =
      await fetch(url, {

        method: "POST",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body: JSON.stringify({

          name: name,

          category: category,

          ingredients: ingredients,

          instructions: instructions

        })

      });


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Save error:",
        response.status,
        errorText
      );

      alert(
        "保存失败 😢\n" +
        errorText
      );

      return;
    }


    alert(
      "食谱保存成功 ❤️"
    );


    document.getElementById("recipeName").value = "";

    document.getElementById("recipeIngredients").value = "";

    document.getElementById("recipeInstructions").value = "";


    await loadRecipes();


    showPage(
      "recipes",
      document.querySelector("nav button")
    );


  } catch (error) {

    console.error(
      "Save connection error:",
      error
    );

    alert(
      "无法连接数据库 😢"
    );

  } finally {

    saveButton.disabled = false;

    saveButton.textContent =
      "保存食谱 ❤️";
  }
}


/* =====================================================
   点菜
   ===================================================== */

function orderRecipe(id) {

  const recipe =
    recipes.find(function(item) {

      return String(item.id) === String(id);

    });


  if (!recipe) {
    return;
  }


  let today =
    JSON.parse(
      localStorage.getItem("liuTaiToday") || "[]"
    );


  today.push({

    name: recipe.name,

    time:
      new Date().toLocaleTimeString(
        "zh-CN",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      )

  });


  localStorage.setItem(
    "liuTaiToday",
    JSON.stringify(today)
  );


  alert(
    recipe.name +
    " 已加入今日菜单 ❤️"
  );


  renderToday();
}


/* =====================================================
   今日菜单
   ===================================================== */

function renderToday() {

  const box =
    document.getElementById("todayList");


  const today =
    JSON.parse(
      localStorage.getItem("liuTaiToday") || "[]"
    );


  if (!today.length) {

    box.innerHTML =
      '<div class="empty">今天还没有人点菜 😊</div>';

    return;
  }


  box.innerHTML =
    today.map(function(item, index) {

      return `
        <div class="card">

          <h2>
            🍽️ ${escapeHTML(item.name)}
          </h2>

          <p>
            点菜时间：
            ${escapeHTML(item.time)}
          </p>

          <button
            class="delete"
            onclick="removeOrder(${index})">

            取消

          </button>

        </div>
      `;

    }).join("");
}


/* =====================================================
   删除今日菜单
   ===================================================== */

function removeOrder(index) {

  let today =
    JSON.parse(
      localStorage.getItem("liuTaiToday") || "[]"
    );


  today.splice(index, 1);


  localStorage.setItem(
    "liuTaiToday",
    JSON.stringify(today)
  );


  renderToday();
}


/* =====================================================
   页面切换
   ===================================================== */

function showPage(page, button) {

  document
    .getElementById("recipes")
    .classList.add("hidden");

  document
    .getElementById("add")
    .classList.add("hidden");

  document
    .getElementById("today")
    .classList.add("hidden");


  document
    .getElementById(page)
    .classList.remove("hidden");


  document
    .querySelectorAll("nav button")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });


  button.classList.add("active");


  if (page === "recipes") {

    loadRecipes();

  }


  if (page === "today") {

    renderToday();

  }
}


/* =====================================================
   安全显示文字
   ===================================================== */

function escapeHTML(text) {

  return String(text)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");
}


/* =====================================================
   启动
   ===================================================== */

loadRecipes();

renderToday();

</script>

</body>
</html>
